syntax = "proto3";

package vault.v1;

import "patch/go.proto";
import "temporal/v1/temporal.proto";

option go_package = "github.com/metacensus/workers-chain/gen/workflows/vault/v1;vaultv1";

// Vault service defines low-level Vault operations for auth and policy management.
// These activities are used internally by the secrets service.
service Vault {
  option (temporal.v1.service) = {task_queue: "infra"};

  // CreateAuthRole creates a Kubernetes auth role binding a service account to policies
  rpc CreateAuthRole(CreateAuthRoleInput) returns (CreateAuthRoleOutput) {
    option (temporal.v1.activity) = {
      name: "vault.v1.CreateAuthRole"
      schedule_to_close_timeout: {seconds: 300}
    };
  }

  // DeleteAuthRole deletes an existing Kubernetes auth role
  rpc DeleteAuthRole(DeleteAuthRoleInput) returns (DeleteAuthRoleOutput) {
    option (temporal.v1.activity) = {
      name: "vault.v1.DeleteAuthRole"
      schedule_to_close_timeout: {seconds: 300}
    };
  }

  // CreatePolicy creates a new Vault policy with the specified document
  rpc CreatePolicy(CreatePolicyInput) returns (CreatePolicyOutput) {
    option (temporal.v1.activity) = {
      name: "vault.v1.CreatePolicy"
      schedule_to_close_timeout: {seconds: 300}
    };
  }

  // DeletePolicy deletes an existing Vault policy
  rpc DeletePolicy(DeletePolicyInput) returns (DeletePolicyOutput) {
    option (temporal.v1.activity) = {
      name: "vault.v1.DeletePolicy"
      schedule_to_close_timeout: {seconds: 300}
    };
  }
}

// ==================== Auth Role Messages ====================

message CreateAuthRoleInput {
  string role_name = 1 [
    json_name = "RoleName",
    (go.field).tags = 'json:"RoleName" validate:"required"'
  ];

  string service_account_name = 2 [
    json_name = "ServiceAccountName",
    (go.field).tags = 'json:"ServiceAccountName" validate:"required"'
  ];

  string kubernetes_namespace = 3 [
    json_name = "KubernetesNamespace",
    (go.field).tags = 'json:"KubernetesNamespace" validate:"required"'
  ];

  repeated string policy_names = 4 [
    json_name = "PolicyNames",
    (go.field).tags = 'json:"PolicyNames" validate:"required"'
  ];
}

message CreateAuthRoleOutput {
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

message DeleteAuthRoleInput {
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

message DeleteAuthRoleOutput {}

// ==================== Policy Messages ====================

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CREATE = 1;
  CAPABILITY_READ = 2;
  CAPABILITY_UPDATE = 3;
  CAPABILITY_PATCH = 4;
  CAPABILITY_DELETE = 5;
  CAPABILITY_LIST = 6;
  CAPABILITY_SUDO = 7;
  CAPABILITY_DENY = 8;
  CAPABILITY_SUBSCRIBE = 9;
  CAPABILITY_RECOVER = 10;
}

message PolicyRule {
  string path = 1 [
    json_name = "Path",
    (go.field).tags = 'json:"Path" validate:"required"'
  ];

  repeated Capability capabilities = 2 [
    json_name = "Capabilities",
    (go.field).tags = 'json:"Capabilities" validate:"required"'
  ];
}

message PolicyDocument {
  repeated PolicyRule rules = 1 [
    json_name = "Rules",
    (go.field).tags = 'json:"Rules" validate:"required"'
  ];
}

message CreatePolicyInput {
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  PolicyDocument document = 2 [
    json_name = "Document",
    (go.field).tags = 'json:"Document" validate:"required"'
  ];
}

message CreatePolicyOutput {
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

message DeletePolicyInput {
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

message DeletePolicyOutput {}
