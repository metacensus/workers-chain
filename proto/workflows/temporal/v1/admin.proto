syntax = "proto3";

package temporal.v1;

import "google/protobuf/duration.proto";
import "patch/go.proto";
import "temporal/v1/temporal.proto";

option go_package = "github.com/metacensus/workers-chain/gen/workflows/temporal/v1;temporalv1";

// Admin service defines workflows and activities for Temporal namespace management
service Admin {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // CreateNamespace orchestrates the creation of a new Temporal namespace
  // This is a workflow (not an activity) because namespace creation in Temporal is async
  // and requires polling to verify the namespace is active before returning.
  rpc CreateNamespace(CreateNamespaceInput) returns (CreateNamespaceOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "temporal.v1.CreateNamespace"
      id: 'temporal/create-namespace/${! Name }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // RegisterNamespace creates a new Temporal namespace with specified retention policy
  // Idempotent: returns success if namespace already exists
  rpc RegisterNamespace(RegisterNamespaceInput) returns (RegisterNamespaceOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "temporal.v1.RegisterNamespace"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }

  // DescribeNamespace retrieves the current state of a Temporal namespace
  // Used by the workflow to poll until namespace is active
  rpc DescribeNamespace(DescribeNamespaceInput) returns (DescribeNamespaceOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "temporal.v1.DescribeNamespace"
      schedule_to_close_timeout: {seconds: 60} /* 1 minute */
    };
  }

  // CreateNexusEndpoint creates a global Nexus endpoint for cross-namespace Workflow calls
  // This endpoint acts as a reverse proxy, routing Nexus requests from caller namespaces
  // to a target namespace and task queue (typically for CreateScopedIdentityAccess service).
  // Idempotent: returns success if endpoint already exists with same configuration.
  rpc CreateNexusEndpoint(CreateNexusEndpointInput) returns (CreateNexusEndpointOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "temporal.v1.CreateNexusEndpoint"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }

  // DescribeNexusEndpoint retrieves the current configuration of a Nexus endpoint
  // Used to fetch existing ACL before updating (for ACL update workflows)
  rpc DescribeNexusEndpoint(DescribeNexusEndpointInput) returns (DescribeNexusEndpointOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "temporal.v1.DescribeNexusEndpoint"
      schedule_to_close_timeout: {seconds: 60} /* 1 minute */
    };
  }

  // UpdateNexusEndpoint updates an existing Nexus endpoint configuration
  // NOTE: This REPLACES the entire endpoint configuration.
  // Caller must provide the complete desired configuration.
  rpc UpdateNexusEndpoint(UpdateNexusEndpointInput) returns (UpdateNexusEndpointOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "temporal.v1.UpdateNexusEndpoint"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }
}

// ==================== Namespace State Enum ====================

// NamespaceState represents the lifecycle state of a Temporal namespace
enum NamespaceState {
  UNSPECIFIED = 0;
  REGISTERED = 1; // Namespace is active and ready
  DEPRECATED = 2; // Namespace is marked as deprecated
}

// ==================== CreateNamespace Workflow Messages ====================

// CreateNamespaceInput specifies parameters for creating a Temporal namespace
message CreateNamespaceInput {
  // name is the name of the namespace to create (e.g., "fabric-shard-org1", "tenant-acme")
  // This will be used as the workflow ID to ensure idempotency
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  // retention is the duration to retain workflow history
  // If not set, defaults to 30 days (2592000 seconds)
  optional google.protobuf.Duration retention = 2 [
    json_name = "Retention",
    (go.field).tags = 'json:"Retention,omitempty" validate:"omitempty"'
  ];
}

// CreateNamespaceOutput indicates successful namespace creation
message CreateNamespaceOutput {
  // name echoes back the created namespace name
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

// ==================== RegisterNamespace Activity Messages ====================

// RegisterNamespaceInput specifies parameters for the RegisterNamespace activity
message RegisterNamespaceInput {
  // name is the name of the namespace to create
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  // retention is the duration to retain workflow history
  // If not set, defaults to 30 days (2592000 seconds)
  optional google.protobuf.Duration retention = 2 [
    json_name = "Retention",
    (go.field).tags = 'json:"Retention,omitempty" validate:"omitempty"'
  ];
}

// RegisterNamespaceOutput indicates successful namespace registration
message RegisterNamespaceOutput {
  // Empty - successful completion indicated by absence of error
}

// ==================== DescribeNamespace Activity Messages ====================

// DescribeNamespaceInput specifies which namespace to describe
message DescribeNamespaceInput {
  // name is the name of the namespace to describe
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
}

// DescribeNamespaceOutput returns the current state of a namespace
message DescribeNamespaceOutput {
  // name is the name of the described namespace
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  // state is the current lifecycle state of the namespace
  NamespaceState state = 2 [
    json_name = "State",
    (go.field).tags = 'json:"State" validate:"required"'
  ];
}

// ==================== Nexus Endpoint Configuration ====================

// Endpoint defines a Nexus endpoint configuration
message Endpoint {
  // id: server-generated unique endpoint identifier
  string id = 1 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];

  // name: endpoint name (e.g., "CreateScopedIdentityAccess")
  string name = 2 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  // namespace: Temporal namespace to route requests to
  string namespace = 3 [
    json_name = "Namespace",
    (go.field).tags = 'json:"Namespace" validate:"required"'
  ];

  // task_queue: task queue within target namespace
  string task_queue = 4 [
    json_name = "TaskQueue",
    (go.field).tags = 'json:"TaskQueue" validate:"required"'
  ];
}

// ==================== CreateNexusEndpoint Activity Messages ====================

message CreateNexusEndpointInput {
  // name: endpoint name
  string name = 1 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];

  // namespace: Temporal namespace to route to
  string namespace = 2 [
    json_name = "Namespace",
    (go.field).tags = 'json:"Namespace" validate:"required"'
  ];

  // task_queue: task queue within target namespace
  string task_queue = 3 [
    json_name = "TaskQueue",
    (go.field).tags = 'json:"TaskQueue" validate:"required"'
  ];
}

message CreateNexusEndpointOutput {
  // id: server-generated unique endpoint identifier
  string id = 1 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];
}

// ==================== DescribeNexusEndpoint Activity Messages ====================

message DescribeNexusEndpointInput {
  // id: endpoint identifier to describe
  string id = 1 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];
}

message DescribeNexusEndpointOutput {
  Endpoint endpoint = 1 [
    json_name = "Endpoint",
    (go.field).tags = 'json:"Endpoint" validate:"required"'
  ];
}

// ==================== UpdateNexusEndpoint Activity Messages ====================

// ⚠️ REPLACES entire endpoint configuration (caller provides complete desired state)
message UpdateNexusEndpointInput {
  // endpoint: complete endpoint configuration for update
  // Must include id, namespace, and task_queue
  Endpoint endpoint = 1 [
    json_name = "Endpoint",
    (go.field).tags = 'json:"Endpoint" validate:"required"'
  ];
}

message UpdateNexusEndpointOutput {
  // Empty - successful completion indicated by absence of error
}
