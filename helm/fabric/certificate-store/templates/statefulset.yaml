{{- /*
Certificate Store StatefulSet
Deploys PostgreSQL as a StatefulSet for persistent certificate storage.
Used by all Certificate Authorities in the organization.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "certificate-store.name" . }}
  namespace: {{ include "certificate-store.namespace" . }}
  labels:
    {{- include "certificate-store.commonLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "certificate-store.serviceName" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "certificate-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "certificate-store.commonLabels" . | nindent 8 }}
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: postgres
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        # PostgreSQL configuration
        - name: POSTGRES_DB
          value: {{ .Values.database.name | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.database.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "certificate-store.name" . }}-secret
              key: password
        - name: PGDATA
          value: {{ .Values.persistence.mountPath }}/pgdata
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.database.user }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.database.user }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "certificate-store.commonLabels" . | nindent 8 }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
      - {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}



