{{- /*
Certificate Store ServiceAccount
This ServiceAccount is used by the certificate-store pod to authenticate with Vault
via the Kubernetes auth method for fetching database credentials through the CSI driver.

The pod doesn't need any Kubernetes API permissions - it only needs the service account
token that is automatically mounted, which Vault uses for authentication via the
Kubernetes auth backend.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "certificate-store.name" . }}
  namespace: {{ include "certificate-store.namespace" . }}
  labels:
    {{- include "certificate-store.commonLabels" . | nindent 4 }}



