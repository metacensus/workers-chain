{{- /*
Certificate Store Secret
Contains database password for PostgreSQL.
In production, this should be managed by Vault.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "certificate-store.name" . }}-secret
  namespace: {{ include "certificate-store.namespace" . }}
  labels:
    {{- include "certificate-store.commonLabels" . | nindent 4 }}
type: Opaque
data:
  # Password is base64 encoded
  password: {{ .Values.database.password | b64enc }}



