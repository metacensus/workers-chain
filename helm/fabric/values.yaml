# Default values for Hyperledger Fabric deployment
# This is a YAML-formatted file.

# Organization identity
organization:
  # Organization ID (used in labels and names)
  id: "org1"
  # MSP ID for the organization
  mspId: "Org1MSP"

# Global image settings
image:
  # Image pull policy
  pullPolicy: IfNotPresent
  # Image pull secrets (if needed for private registries)
  pullSecrets: []

# Certificate Authority configuration
ca:
  # Number of CA instances to deploy
  count: 1
  # CA image
  image:
    repository: hyperledger/fabric-ca
    tag: "1.5.5"
  # Service configuration
  service:
    type: ClusterIP
    port: 7054
  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Certificate secret names (array, one per CA instance)
  # Format: ca-<org>-<index>
  certSecrets:
    - "fabric-ca-0-certs"

# Peer configuration
peer:
  # Number of peer instances to deploy
  count: 2
  # Peer image
  image:
    repository: hyperledger/fabric-peer
    tag: "2.5.0"
  # Service configuration
  service:
    type: ClusterIP
    port: 7051
  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # TLS configuration
  tls:
    enabled: true
    clientAuthRequired: false
  # Certificate secret names (array, one per peer)
  # Format: peer-<org>-<index>
  certSecrets:
    - "fabric-peer-0-certs"
    - "fabric-peer-1-certs"
  # Logging level
  loggingSpec: "INFO"
  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /
      port: 7051
    initialDelaySeconds: 10
    periodSeconds: 5

# CouchDB configuration (automatically paired with peers)
couchdb:
  # CouchDB image
  image:
    repository: couchdb
    tag: "3.3.2"
  # Service configuration
  service:
    type: ClusterIP
    port: 5984
  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Default credentials (should be overridden with secrets in production)
  user: "admin"
  password: "adminpw"
  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /_up
      port: 5984
    initialDelaySeconds: 10
    periodSeconds: 5

# Orderer configuration
orderer:
  # Number of orderer instances to deploy
  count: 3
  # Orderer image
  image:
    repository: hyperledger/fabric-orderer
    tag: "2.5.0"
  # Service configuration
  service:
    type: ClusterIP
    port: 7050
  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # MSP ID for orderers
  mspId: "OrdererMSP"
  # TLS configuration
  tls:
    enabled: true
    clientAuthRequired: false
  # Certificate secret names (array, one per orderer)
  # Format: orderer-<org>-<index>
  certSecrets:
    - "fabric-orderer-0-certs"
    - "fabric-orderer-1-certs"
    - "fabric-orderer-2-certs"
  # Logging level
  loggingSpec: "INFO"
  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /
      port: 7050
    initialDelaySeconds: 10
    periodSeconds: 5

# Standard MSP paths (Hyperledger Fabric conventions)
msp:
  # Base path for MSP configuration
  basePath: "/etc/hyperledger/fabric/msp"
  # MSP directory structure
  paths:
    signcerts: "/etc/hyperledger/fabric/msp/signcerts/cert.pem"
    keystore: "/etc/hyperledger/fabric/msp/keystore/key.pem"
    cacerts: "/etc/hyperledger/fabric/msp/cacerts/ca.pem"

# Kubernetes namespace (if creating namespace is desired)
namespace:
  # Create namespace if it doesn't exist
  create: false
  # Namespace name (defaults to Release.Namespace)
  name: ""

# Common labels to apply to all resources
commonLabels:
  app.kubernetes.io/managed-by: helm
  app.kubernetes.io/part-of: fabric

