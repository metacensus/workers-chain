{{- /*
SecretProviderClass for Vault CSI Driver
Configures how the Vault CSI driver mounts Fabric certificates into pods.
Each identity (peer, orderer, admin, etc.) gets its own SPC.
The SPC defines:
- Which Vault path to fetch secrets from
- How to mount those secrets into the pod filesystem
- Pod mount point: /etc/fabric/{organization}/msp
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "fabric-spc.resourceName" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-spc.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.vault.address }}
    roleName: fabric-{{ .Values.organization }}
    secretPath: {{ include "fabric-spc.vaultPath" . }}
    secretArgs: "" # All files from the Vault path
    objectFormat: "yaml"
    objectEncoding: "base64"

