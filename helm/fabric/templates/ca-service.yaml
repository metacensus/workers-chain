{{- range $index := until (int .Values.ca.count) }}
{{- $caName := printf "ca%d-%s" $index $.Values.organization.id }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $caName }}
  namespace: {{ include "fabric.namespace" $ }}
  labels:
    {{- include "fabric.ca.labels" $ | nindent 4 }}
    app: fabric-ca
    ca-index: "{{ $index }}"
spec:
  type: {{ $.Values.ca.service.type }}
  selector:
    app: fabric-ca
    ca-name: {{ $caName }}
  ports:
  - name: ca
    port: {{ $.Values.ca.service.port }}
    targetPort: {{ $.Values.ca.service.port }}
    protocol: TCP
{{- end }}

