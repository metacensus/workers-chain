{{- range $index := until (int .Values.peer.count) }}
{{- $peerName := printf "peer%d-%s" $index $.Values.organization.id }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $peerName }}
  namespace: {{ include "fabric.namespace" $ }}
  labels:
    {{- include "fabric.peer.labels" $ | nindent 4 }}
    app: fabric-peer
    peer-index: "{{ $index }}"
spec:
  type: {{ $.Values.peer.service.type }}
  selector:
    app: fabric-peer
    peer-name: {{ $peerName }}
  ports:
  - name: peer
    port: {{ $.Values.peer.service.port }}
    targetPort: {{ $.Values.peer.service.port }}
    protocol: TCP
{{- end }}

