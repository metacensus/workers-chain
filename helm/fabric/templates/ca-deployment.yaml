{{- range $index := until (int .Values.ca.count) }}
{{- $caName := printf "ca%d-%s" $index $.Values.organization.id }}
{{- $certSecret := index $.Values.ca.certSecrets $index | default (printf "fabric-ca-%d-certs" $index) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $caName }}
  namespace: {{ include "fabric.namespace" $ }}
  labels:
    {{- include "fabric.ca.labels" $ | nindent 4 }}
    app: fabric-ca
    ca-index: "{{ $index }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-ca
      ca-name: {{ $caName }}
  template:
    metadata:
      labels:
        {{- include "fabric.ca.labels" $ | nindent 8 }}
        app: fabric-ca
        ca-name: {{ $caName }}
    spec:
      {{- include "fabric.imagePullSecrets" $ | nindent 6 }}
      containers:
      - name: fabric-ca
        image: "{{ $.Values.ca.image.repository }}:{{ $.Values.ca.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: ca
          containerPort: {{ $.Values.ca.service.port }}
          protocol: TCP
        env:
        - name: FABRIC_CA_HOME
          value: "/etc/hyperledger/fabric-ca-server"
        - name: FABRIC_CA_SERVER_CA_NAME
          value: {{ $caName }}
        - name: FABRIC_CA_SERVER_TLS_ENABLED
          value: "true"
        - name: FABRIC_CA_SERVER_PORT
          value: "{{ $.Values.ca.service.port }}"
        volumeMounts:
        {{- include "fabric.mspVolumeMount" $ | nindent 8 }}
        resources:
          {{- toYaml $.Values.ca.resources | nindent 10 }}
      volumes:
      {{- include "fabric.mspVolume" $certSecret | nindent 6 }}
{{- end }}

