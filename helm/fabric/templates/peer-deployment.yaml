{{- range $index := until (int .Values.peer.count) }}
{{- $peerName := printf "peer%d-%s" $index $.Values.organization.id }}
{{- $couchdbName := printf "couchdb-peer%d-%s" $index $.Values.organization.id }}
{{- $certSecret := index $.Values.peer.certSecrets $index | default (printf "fabric-peer-%d-certs" $index) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $peerName }}
  namespace: {{ include "fabric.namespace" $ }}
  labels:
    {{- include "fabric.peer.labels" $ | nindent 4 }}
    app: fabric-peer
    peer-index: "{{ $index }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-peer
      peer-name: {{ $peerName }}
  template:
    metadata:
      labels:
        {{- include "fabric.peer.labels" $ | nindent 8 }}
        app: fabric-peer
        peer-name: {{ $peerName }}
    spec:
      {{- include "fabric.imagePullSecrets" $ | nindent 6 }}
      containers:
      - name: fabric-peer
        image: "{{ $.Values.peer.image.repository }}:{{ $.Values.peer.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: peer
          containerPort: {{ $.Values.peer.service.port }}
          protocol: TCP
        env:
        - name: FABRIC_LOGGING_SPEC
          value: {{ $.Values.peer.loggingSpec | quote }}
        - name: CORE_PEER_ID
          value: {{ $peerName }}
        - name: CORE_PEER_ADDRESS
          value: "{{ $peerName }}:{{ $.Values.peer.service.port }}"
        - name: CORE_PEER_LOCALMSPID
          value: {{ $.Values.organization.mspId | quote }}
        - name: CORE_PEER_MSPCONFIGPATH
          value: {{ $.Values.msp.basePath }}
        # CouchDB configuration
        - name: CORE_LEDGER_STATE_STATEDATABASE
          value: "CouchDB"
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS
          value: "{{ $couchdbName }}:{{ $.Values.couchdb.service.port }}"
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME
          value: {{ $.Values.couchdb.user | quote }}
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD
          value: {{ $.Values.couchdb.password | quote }}
        # TLS configuration
        - name: CORE_PEER_TLS_ENABLED
          value: {{ $.Values.peer.tls.enabled | quote }}
        {{- if $.Values.peer.tls.enabled }}
        - name: CORE_PEER_TLS_CERT_FILE
          value: {{ $.Values.msp.paths.signcerts }}
        - name: CORE_PEER_TLS_KEY_FILE
          value: {{ $.Values.msp.paths.keystore }}
        - name: CORE_PEER_TLS_ROOTCERT_FILE
          value: {{ $.Values.msp.paths.cacerts }}
        - name: CORE_PEER_TLS_CLIENTAUTHREQUIRED
          value: {{ $.Values.peer.tls.clientAuthRequired | quote }}
        {{- end }}
        volumeMounts:
        {{- include "fabric.mspVolumeMount" $ | nindent 8 }}
        resources:
          {{- toYaml $.Values.peer.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml $.Values.peer.readinessProbe | nindent 10 }}
      volumes:
      {{- include "fabric.mspVolume" $certSecret | nindent 6 }}
{{- end }}

