{{- range $index := until (int .Values.orderer.count) }}
{{- $ordererName := printf "orderer%d-%s" $index $.Values.organization.id }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ordererName }}
  namespace: {{ include "fabric.namespace" $ }}
  labels:
    {{- include "fabric.orderer.labels" $ | nindent 4 }}
    app: fabric-orderer
    orderer-index: "{{ $index }}"
spec:
  type: {{ $.Values.orderer.service.type }}
  selector:
    app: fabric-orderer
    orderer-name: {{ $ordererName }}
  ports:
  - name: orderer
    port: {{ $.Values.orderer.service.port }}
    targetPort: {{ $.Values.orderer.service.port }}
    protocol: TCP
{{- end }}

