# Fabric Orderer Configuration
# This chart deploys a Hyperledger Fabric orderer node

# Organization identifier (e.g., "org1", "acme-corp")
org: "org1"

namespace: "fabric-shard-org1"

# Orderer identifier (e.g., "orderer0", "orderer1")
ordererId: "orderer0"

# Container image configuration
image:
  repository: hyperledger/fabric-orderer
  tag: "2.5.0"
  pullPolicy: IfNotPresent

# Number of replicas (1 per StatefulSet - scale by adding orderers)
replicas: 1

# MSP configuration
msp:
  id: "org1MSP"

# Vault configuration for CSI driver
# Org CA paths live in the org's shard tree; the TLS root CA cert lives in the
# operator's shared tree (here operator "metacensus").
vault:
  roleName: "fabric-shard-org1-orderer0"
  mspSigningKeyPath: "secret/data/fabric/shard/org1/keys/orderer/orderer0/signing"
  mspSigningCertPath: "secret/data/fabric/shard/org1/certs/orderer/orderer0/signing"
  mspRootCaCertPath: "secret/data/fabric/shard/org1/certs/ca/org/root/signing"
  tlsKeyPath: "secret/data/fabric/shard/org1/keys/orderer/orderer0/tls"
  tlsCertPath: "secret/data/fabric/shard/org1/certs/orderer/orderer0/tls"
  tlsRootCaCertPath: "secret/data/fabric/metacensus/certs/ca/tls/root/signing"

# Service configuration
service:
  type: ClusterIP
  port: 7050
  adminPort: 7053
  operationsPort: 9443

# Persistence configuration
persistence:
  storageClass: ""
  accessModes:
  - ReadWriteOnce
  size: 20Gi

# Logging configuration
logging:
  level: INFO

# Resource requests and limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Liveness probe configuration
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

# Readiness probe configuration
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

# Common labels applied to all resources
commonLabels:
  managedBy: temporal
  partOf: fabric

