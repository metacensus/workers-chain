{{- /*
Orderer StatefulSet
Deploys a Hyperledger Fabric orderer as a StatefulSet for stable network identity
and persistent ledger storage.

Note: Fabric 2.5+ uses BootstrapMethod=none (no system channel).
Channels are joined dynamically via osnadmin CLI after orderer is running.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orderer.name" . }}
  namespace: {{ include "orderer.namespace" . }}
  labels:
    {{- include "orderer.commonLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "orderer.serviceName" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "orderer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderer.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orderer.name" . }}
      containers:
      - name: orderer
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: admin
          containerPort: {{ .Values.service.adminPort }}
          protocol: TCP
        - name: operations
          containerPort: {{ .Values.service.operationsPort }}
          protocol: TCP
        env:
        # General orderer configuration
        - name: ORDERER_GENERAL_LISTENADDRESS
          value: "0.0.0.0"
        - name: ORDERER_GENERAL_LISTENPORT
          value: {{ .Values.service.port | quote }}
        - name: ORDERER_GENERAL_BOOTSTRAPMETHOD
          value: "none"  # No system channel - use osnadmin channel join
        # MSP configuration
        - name: ORDERER_GENERAL_LOCALMSPID
          value: {{ .Values.msp.id | quote }}
        - name: ORDERER_GENERAL_LOCALMSPDIR
          value: "/etc/hyperledger/fabric/msp"
        # TLS configuration
        - name: ORDERER_GENERAL_TLS_ENABLED
          value: "true"
        - name: ORDERER_GENERAL_TLS_CERTIFICATE
          value: "/etc/hyperledger/fabric/tls/server.crt"
        - name: ORDERER_GENERAL_TLS_PRIVATEKEY
          value: "/etc/hyperledger/fabric/tls/server.key"
        - name: ORDERER_GENERAL_TLS_ROOTCAS
          value: "[/etc/hyperledger/fabric/tls/ca.crt]"
        # Cluster TLS (for Raft consensus between orderers)
        - name: ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE
          value: "/etc/hyperledger/fabric/tls/server.crt"
        - name: ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY
          value: "/etc/hyperledger/fabric/tls/server.key"
        - name: ORDERER_GENERAL_CLUSTER_ROOTCAS
          value: "[/etc/hyperledger/fabric/tls/ca.crt]"
        # Admin API configuration (for osnadmin CLI)
        - name: ORDERER_ADMIN_LISTENADDRESS
          value: "0.0.0.0:{{ .Values.service.adminPort }}"
        - name: ORDERER_ADMIN_TLS_ENABLED
          value: "true"
        - name: ORDERER_ADMIN_TLS_CERTIFICATE
          value: "/etc/hyperledger/fabric/tls/server.crt"
        - name: ORDERER_ADMIN_TLS_PRIVATEKEY
          value: "/etc/hyperledger/fabric/tls/server.key"
        - name: ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED
          value: "true"
        - name: ORDERER_ADMIN_TLS_CLIENTROOTCAS
          value: "[/etc/hyperledger/fabric/tls/ca.crt]"
        # Operations endpoint (metrics/health)
        - name: ORDERER_OPERATIONS_LISTENADDRESS
          value: "0.0.0.0:{{ .Values.service.operationsPort }}"
        - name: ORDERER_METRICS_PROVIDER
          value: "prometheus"
        # Logging
        - name: FABRIC_LOGGING_SPEC
          value: {{ .Values.logging.level | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: operations
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: operations
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
        volumeMounts:
        # Persistent ledger storage
        - name: data
          mountPath: /var/hyperledger/production
        # MSP configuration (assembled from secrets)
        - name: msp-config
          mountPath: /etc/hyperledger/fabric/msp/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: msp-signcerts
          mountPath: /etc/hyperledger/fabric/msp/signcerts
          readOnly: true
        - name: msp-keystore
          mountPath: /etc/hyperledger/fabric/msp/keystore
          readOnly: true
        - name: msp-cacerts
          mountPath: /etc/hyperledger/fabric/msp/cacerts
          readOnly: true
        - name: msp-intermediatecerts
          mountPath: /etc/hyperledger/fabric/msp/intermediatecerts
          readOnly: true
        # TLS certificates
        - name: tls
          mountPath: /etc/hyperledger/fabric/tls
          readOnly: true
        # Vault secrets raw mount
        - name: vault-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
      initContainers:
      # Init container to set up MSP directory structure from Vault secrets
      - name: setup-msp
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          # Create MSP directory structure
          # Fabric MSP requires: cacerts (root CA), intermediatecerts (int CA), signcerts, keystore, config.yaml
          mkdir -p /msp/signcerts /msp/keystore /msp/cacerts /msp/intermediatecerts
          mkdir -p /tls
          
          # Copy orderer signing certificate and key
          cp /secrets/msp-signing-cert /msp/signcerts/cert.pem
          cp /secrets/msp-signing-key /msp/keystore/key.pem
          
          # Extract intermediate CA cert from signing chain for MSP intermediatecerts/
          # The chain format is: [leaf cert][intermediate CA cert][root CA cert]
          # We need to extract just the intermediate CA cert (second cert in chain)
          # Use awk to extract the second certificate block from the PEM chain
          awk '/-----BEGIN CERTIFICATE-----/{n++} n==2{print; if(/-----END CERTIFICATE-----/) exit}' \
            /secrets/msp-signing-chain > /msp/intermediatecerts/intermediate.pem
          
          # Copy MSP root CA certificate for cacerts/ (root CA only for trust store)
          cp /secrets/msp-root-ca-cert /msp/cacerts/ca.pem
          
          # Create MSP config.yaml for NodeOUs classification
          # This enables identity classification based on OU field in certificates
          # (peer, orderer, admin, client) without needing explicit admincerts directory
          # NOTE: Certificate must point to the CA that SIGNS identity certs (intermediate CA)
          # not the root CA, since orderers are enrolled with the intermediate CA (org/v1)
          printf '%s\n' \
            'NodeOUs:' \
            '  Enable: true' \
            '  ClientOUIdentifier:' \
            '    Certificate: "intermediatecerts/intermediate.pem"' \
            '    OrganizationalUnitIdentifier: "client"' \
            '  PeerOUIdentifier:' \
            '    Certificate: "intermediatecerts/intermediate.pem"' \
            '    OrganizationalUnitIdentifier: "peer"' \
            '  AdminOUIdentifier:' \
            '    Certificate: "intermediatecerts/intermediate.pem"' \
            '    OrganizationalUnitIdentifier: "admin"' \
            '  OrdererOUIdentifier:' \
            '    Certificate: "intermediatecerts/intermediate.pem"' \
            '    OrganizationalUnitIdentifier: "orderer"' \
            > /msp/config.yaml
          
          # TLS certificates - use pre-built chain for server cert, root only for trust store
          # server.crt = full chain (sent during mTLS handshake)
          cp /secrets/tls-chain /tls/server.crt
          cp /secrets/tls-key /tls/server.key
          # Trust store = root CA only (intermediate rotation without trust store updates)
          cp /secrets/tls-root-ca-cert /tls/ca.crt
          
          # Set permissions
          chmod 644 /msp/signcerts/* /msp/cacerts/* /msp/intermediatecerts/* /msp/config.yaml /tls/*.crt
          chmod 600 /msp/keystore/* /tls/*.key
        volumeMounts:
        - name: vault-secrets
          mountPath: /secrets
          readOnly: true
        - name: msp-config
          mountPath: /msp
        - name: msp-signcerts
          mountPath: /msp/signcerts
        - name: msp-keystore
          mountPath: /msp/keystore
        - name: msp-cacerts
          mountPath: /msp/cacerts
        - name: msp-intermediatecerts
          mountPath: /msp/intermediatecerts
        - name: tls
          mountPath: /tls
      volumes:
      - name: vault-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "orderer.name" . }}-vault
      - name: msp-config
        emptyDir: {}
      - name: msp-signcerts
        emptyDir: {}
      - name: msp-keystore
        emptyDir: {}
      - name: msp-cacerts
        emptyDir: {}
      - name: msp-intermediatecerts
        emptyDir: {}
      - name: tls
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "orderer.commonLabels" . | nindent 8 }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
      - {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}

