{{- /*
Orderer Deployment
Renders a single Hyperledger Fabric orderer node.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric-orderer.name" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-orderer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fabric-orderer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-orderer.labels" . | nindent 8 }}
    spec:
      serviceAccountName: fabric-{{ .Values.organization.id }}
      {{- include "fabric.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: orderer
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: orderer
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: FABRIC_LOGGING_SPEC
          value: {{ .Values.loggingSpec | quote }}
        - name: ORDERER_GENERAL_LISTENADDRESS
          value: "0.0.0.0"
        - name: ORDERER_GENERAL_LISTENPORT
          value: "{{ .Values.service.port }}"
        - name: ORDERER_GENERAL_LOCALMSPID
          value: {{ .Values.mspId | quote }}
        - name: ORDERER_GENERAL_LOCALMSPDIR
          value: {{ .Values.msp.basePath }}
        {{- if .Values.tls.enabled }}
        - name: ORDERER_GENERAL_TLS_ENABLED
          value: "true"
        - name: ORDERER_GENERAL_TLS_PRIVATEKEY
          value: {{ .Values.msp.paths.keystore }}
        - name: ORDERER_GENERAL_TLS_CERTIFICATE
          value: {{ .Values.msp.paths.signcerts }}
        - name: ORDERER_GENERAL_TLS_ROOTCAS
          value: "[{{ .Values.msp.paths.cacerts }}]"
        - name: ORDERER_GENERAL_TLS_CLIENTAUTHREQUIRED
          value: {{ .Values.tls.clientAuthRequired | quote }}
        # Cluster TLS configuration (for Raft consensus)
        - name: ORDERER_GENERAL_CLUSTER_SERVERCERTIFICATE
          value: {{ .Values.msp.paths.signcerts }}
        - name: ORDERER_GENERAL_CLUSTER_SERVERPRIVATEKEY
          value: {{ .Values.msp.paths.keystore }}
        - name: ORDERER_GENERAL_CLUSTER_ROOTCAS
          value: "[{{ .Values.msp.paths.cacerts }}]"
        - name: ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE
          value: {{ .Values.msp.paths.signcerts }}
        - name: ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY
          value: {{ .Values.msp.paths.keystore }}
        {{- end }}
        volumeMounts:
        {{- if .Values.msp.csi.enabled }}
        {{- include "fabric.csiVolumeMount" . | nindent 8 }}
        {{- else }}
        {{- include "fabric.mspVolumeMount" . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}

      volumes:
      {{- if .Values.msp.csi.enabled }}
      {{- include "fabric.csiVolume" .Values.msp.csi.secretProviderClassName | nindent 6 }}
      {{- else }}
      {{- include "fabric.mspVolume" (printf "fabric-msp-%s" (include "fabric-orderer.name" .)) | nindent 6 }}
      {{- end }}

