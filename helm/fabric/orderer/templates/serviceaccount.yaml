{{- /*
Orderer ServiceAccount
This ServiceAccount is used by the orderer pod to authenticate with Vault
via the Kubernetes auth method for fetching certificates through the CSI driver.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orderer.name" . }}
  namespace: {{ include "orderer.namespace" . }}
  labels:
    {{- include "orderer.commonLabels" . | nindent 4 }}

