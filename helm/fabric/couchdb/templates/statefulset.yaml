{{- /*
CouchDB StatefulSet
Deploys CouchDB as a StatefulSet for persistent state database storage.
Each peer gets its own dedicated CouchDB instance.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "couchdb.name" . }}
  namespace: {{ include "couchdb.namespace" . }}
  labels:
    {{- include "couchdb.commonLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "couchdb.serviceName" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "couchdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "couchdb.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "couchdb.name" . }}
      containers:
      - name: couchdb
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        # CouchDB configuration
        - name: COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "couchdb.name" . }}-secret
              key: username
        - name: COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "couchdb.name" . }}-secret
              key: password
        # Cap Erlang's port table: it is sized from the open-file limit, and a
        # runtime that leaves that at 1073741816 gets ~1.5GB allocated at boot
        # and the pod OOMKilled (#54).
        - name: ERL_FLAGS
          value: "+Q 65536"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /_up
            port: http
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: /_up
            port: http
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        - name: vault-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: vault-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "couchdb.name" . }}-vault
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "couchdb.commonLabels" . | nindent 8 }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
      - {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}

