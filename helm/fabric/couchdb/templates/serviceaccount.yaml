{{- /*
CouchDB ServiceAccount
This ServiceAccount is used by the CouchDB pod to authenticate with Vault
via the Kubernetes auth method for fetching credentials through the CSI driver.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "couchdb.name" . }}
  namespace: {{ include "couchdb.namespace" . }}
  labels:
    {{- include "couchdb.commonLabels" . | nindent 4 }}

