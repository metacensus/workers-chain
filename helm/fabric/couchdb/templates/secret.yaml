{{- /*
CouchDB SecretProviderClass
Configures Vault CSI driver to fetch CouchDB credentials from Vault
and sync them to a Kubernetes Secret for use by the CouchDB container.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "couchdb.name" . }}-vault
  namespace: {{ include "couchdb.namespace" . }}
  labels:
    {{- include "couchdb.commonLabels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
  # Sync Vault secret to a Kubernetes Secret for environment variable access
  - secretName: {{ include "couchdb.name" . }}-secret
    type: Opaque
    data:
    - objectName: username
      key: username
    - objectName: password
      key: password
  parameters:
    vaultAddress: "http://vault.secrets.svc.cluster.local:8200"
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      - objectName: "username"
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: "username"
      - objectName: "password"
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: "password"

