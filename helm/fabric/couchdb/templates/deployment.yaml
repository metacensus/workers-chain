{{- /*
CouchDB Deployment
Renders a single CouchDB instance for state database storage.
Typically paired with a peer pod via pod co-location (same pod spec).
Can also be deployed standalone if needed.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric-couchdb.name" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-couchdb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fabric-couchdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-couchdb.labels" . | nindent 8 }}
    spec:
      {{- include "fabric.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: couchdb
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: couchdb
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: COUCHDB_USER
          value: {{ .Values.credentials.username | quote }}
        - name: COUCHDB_PASSWORD
          value: {{ .Values.credentials.password | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}


