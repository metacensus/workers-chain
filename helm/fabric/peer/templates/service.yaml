{{- /*
Peer Service
Exposes the peer port for intra-cluster communication.
Peer nodes connect to each other via this service.
CouchDB is also accessible via a separate service.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fabric-peer.name" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: peer
    port: {{ .Values.service.port }}
    targetPort: peer
    protocol: TCP
  selector:
    {{- include "fabric-peer.selectorLabels" . | nindent 4 }}

{{- if .Values.couchdb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fabric-peer.couchdbName" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
    app.kubernetes.io/component: couchdb
spec:
  type: {{ .Values.couchdb.service.type }}
  ports:
  - name: couchdb
    port: {{ .Values.couchdb.service.port }}
    targetPort: couchdb
    protocol: TCP
  selector:
    {{- include "fabric-peer.selectorLabels" . | nindent 4 }}
{{- end }}

