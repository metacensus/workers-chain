{{- /*
Peer SecretProviderClass
Configures Vault CSI driver to fetch peer certificates from Vault.

Keys (private) and certs (public) are stored at separate Vault paths:
- Keys: keys/peer/{id}/... (signing, tls, couchdb)
- Certs: certs/peer/{id}/... (signing, tls) - each contains {certificate, chain}
- CA certs: certs/ca/... - only root CA needed for trust stores

Certificate chains are pre-built at enrollment time and stored in the "chain" key.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "peer.name" . }}-vault
  namespace: {{ include "peer.namespace" . }}
  labels:
    {{- include "peer.commonLabels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
  # Sync CouchDB credentials to Kubernetes Secret for environment variable access
  - secretName: {{ include "peer.name" . }}-couchdb
    type: Opaque
    data:
    - objectName: couchdb-username
      key: username
    - objectName: couchdb-password
      key: password
  parameters:
    vaultAddress: "http://vault.secrets.svc.cluster.local:8200"
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      # MSP signing identity - separate key and cert paths
      - objectName: "msp-signing-cert"
        secretPath: {{ .Values.vault.mspSigningCertPath | quote }}
        secretKey: "certificate"
      - objectName: "msp-signing-chain"
        secretPath: {{ .Values.vault.mspSigningCertPath | quote }}
        secretKey: "chain"
      - objectName: "msp-signing-key"
        secretPath: {{ .Values.vault.mspSigningKeyPath | quote }}
        secretKey: "private_key"
      # MSP CA root certificate (for trust store - root only)
      - objectName: "msp-root-ca-cert"
        secretPath: {{ .Values.vault.mspRootCaCertPath | quote }}
        secretKey: "certificate"
      # TLS identity - separate key and cert paths
      - objectName: "tls-cert"
        secretPath: {{ .Values.vault.tlsCertPath | quote }}
        secretKey: "certificate"
      - objectName: "tls-chain"
        secretPath: {{ .Values.vault.tlsCertPath | quote }}
        secretKey: "chain"
      - objectName: "tls-key"
        secretPath: {{ .Values.vault.tlsKeyPath | quote }}
        secretKey: "private_key"
      # TLS CA root certificate (for trust store - root only)
      - objectName: "tls-root-ca-cert"
        secretPath: {{ .Values.vault.tlsRootCaCertPath | quote }}
        secretKey: "certificate"
      # CouchDB credentials (under keys/)
      - objectName: "couchdb-username"
        secretPath: {{ .Values.vault.couchdbPath | quote }}
        secretKey: "username"
      - objectName: "couchdb-password"
        secretPath: {{ .Values.vault.couchdbPath | quote }}
        secretKey: "password"

