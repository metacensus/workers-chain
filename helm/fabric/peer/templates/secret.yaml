{{- /*
Peer SecretProviderClass
Configures Vault CSI driver to fetch peer certificates from Vault.
Peers need:
- MSP signing certificate and private key (from Org Int CA)
- TLS certificate, private key, and CA cert (from TLS Int CA)
- CouchDB credentials for state database access
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "peer.name" . }}-vault
  namespace: {{ include "peer.namespace" . }}
  labels:
    {{- include "peer.commonLabels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
  # Sync CouchDB credentials to Kubernetes Secret for environment variable access
  - secretName: {{ include "peer.name" . }}-couchdb
    type: Opaque
    data:
    - objectName: couchdb-username
      key: username
    - objectName: couchdb-password
      key: password
  parameters:
    vaultAddress: "http://vault.secrets.svc.cluster.local:8200"
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      # MSP signing identity (peer's own cert from Org Int CA)
      - objectName: "msp-signing-cert"
        secretPath: {{ .Values.vault.mspSigningPath | quote }}
        secretKey: "certificate"
      - objectName: "msp-signing-key"
        secretPath: {{ .Values.vault.mspSigningPath | quote }}
        secretKey: "private_key"
      # MSP CA certificates - Root CA goes in cacerts/, Int CA in intermediatecerts/
      - objectName: "msp-root-ca-cert"
        secretPath: {{ .Values.vault.mspRootCaCertPath | quote }}
        secretKey: "certificate"
      - objectName: "msp-int-ca-cert"
        secretPath: {{ .Values.vault.mspIntCaCertPath | quote }}
        secretKey: "certificate"
      # TLS identity (from TLS Int CA)
      - objectName: "tls-cert"
        secretPath: {{ .Values.vault.tlsPath | quote }}
        secretKey: "certificate"
      - objectName: "tls-key"
        secretPath: {{ .Values.vault.tlsPath | quote }}
        secretKey: "private_key"
      # TLS CA certificates - Root CA for trust anchor
      - objectName: "tls-root-ca-cert"
        secretPath: {{ .Values.vault.tlsRootCaCertPath | quote }}
        secretKey: "certificate"
      - objectName: "tls-int-ca-cert"
        secretPath: {{ .Values.vault.tlsIntCaCertPath | quote }}
        secretKey: "certificate"
      # CouchDB credentials
      - objectName: "couchdb-username"
        secretPath: {{ .Values.vault.couchdbPath | quote }}
        secretKey: "username"
      - objectName: "couchdb-password"
        secretPath: {{ .Values.vault.couchdbPath | quote }}
        secretKey: "password"

