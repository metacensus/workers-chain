{{- /*
Peer ServiceAccount
This ServiceAccount is used by the peer pod to authenticate with Vault
via the Kubernetes auth method for fetching certificates through the CSI driver.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "peer.name" . }}
  namespace: {{ include "peer.namespace" . }}
  labels:
    {{- include "peer.commonLabels" . | nindent 4 }}

