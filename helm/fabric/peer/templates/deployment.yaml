{{- /*
Peer Deployment
Renders a single Hyperledger Fabric peer node with attached CouchDB state database.
Both peer and couchdb containers run in the same pod.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric-peer.name" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fabric-peer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-peer.labels" . | nindent 8 }}
    spec:
      serviceAccountName: fabric-{{ .Values.organization.id }}
      {{- include "fabric.imagePullSecrets" . | nindent 6 }}
      containers:
      # Peer container
      - name: peer
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: peer
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: FABRIC_LOGGING_SPEC
          value: {{ .Values.loggingSpec | quote }}
        - name: CORE_PEER_ID
          value: {{ include "fabric-peer.name" . }}
        - name: CORE_PEER_ADDRESS
          value: "{{ include "fabric-peer.name" . }}:{{ .Values.service.port }}"
        - name: CORE_PEER_LOCALMSPID
          value: {{ .Values.organization.mspId | quote }}
        - name: CORE_PEER_MSPCONFIGPATH
          value: {{ .Values.msp.basePath }}
        {{- if .Values.couchdb.enabled }}
        - name: CORE_LEDGER_STATE_STATEDATABASE
          value: "CouchDB"
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS
          value: "{{ include "fabric-peer.couchdbName" . }}:{{ .Values.couchdb.service.port }}"
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME
          value: {{ .Values.couchdb.credentials.username | quote }}
        - name: CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD
          value: {{ .Values.couchdb.credentials.password | quote }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: CORE_PEER_TLS_ENABLED
          value: "true"
        - name: CORE_PEER_TLS_CERT_FILE
          value: {{ .Values.msp.paths.signcerts }}
        - name: CORE_PEER_TLS_KEY_FILE
          value: {{ .Values.msp.paths.keystore }}
        - name: CORE_PEER_TLS_ROOTCERT_FILE
          value: {{ .Values.msp.paths.cacerts }}
        - name: CORE_PEER_TLS_CLIENTAUTHREQUIRED
          value: {{ .Values.tls.clientAuthRequired | quote }}
        {{- end }}
        volumeMounts:
        {{- if .Values.msp.csi.enabled }}
        {{- include "fabric.csiVolumeMount" . | nindent 8 }}
        {{- else }}
        {{- include "fabric.mspVolumeMount" . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}

      {{- if .Values.couchdb.enabled }}
      # CouchDB container (state database)
      - name: couchdb
        image: "{{ .Values.couchdb.image.repository }}:{{ .Values.couchdb.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: couchdb
          containerPort: {{ .Values.couchdb.service.port }}
          protocol: TCP
        env:
        - name: COUCHDB_USER
          value: {{ .Values.couchdb.credentials.username | quote }}
        - name: COUCHDB_PASSWORD
          value: {{ .Values.couchdb.credentials.password | quote }}
        resources:
          {{- toYaml .Values.couchdb.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.couchdb.readinessProbe | nindent 10 }}
      {{- end }}

      volumes:
      {{- if .Values.msp.csi.enabled }}
      {{- include "fabric.csiVolume" .Values.msp.csi.secretProviderClassName | nindent 6 }}
      {{- else }}
      {{- include "fabric.mspVolume" (printf "fabric-msp-%s" (include "fabric-peer.name" .)) | nindent 6 }}
      {{- end }}

