{{- /*
Kubernetes Namespace for Fabric components
This chart creates the namespace where all Fabric components will be deployed.
Should be deployed once per organization before any other Fabric charts.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric.commonLabels" . | nindent 4 }}
    # Marks this namespace as hosting a Temporal worker (the fabric / shard
    # worker). Selected by module.temporal's frontend ingress allowlist
    # (allowed_caller_namespace_labels) so the worker may reach Temporal.
    metacensus.io/temporal-worker: "true"

