# Fabric namespace configuration
# The namespace name should follow the pattern: fabric-{org-id}
# This value must be provided at deployment time
name: fabric-example-org

# isOperator indicates whether this is the operator namespace
# When true, network policies are created to allow cross-namespace
# access from fabric org namespaces to TLS CA services on port 7054
# This should only be true for the operator namespace (e.g., fabric-metacensus)
isOperator: false

# Common labels to apply to all resources
commonLabels:
  managedBy: helm
  partOf: fabric

