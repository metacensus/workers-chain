{{- /*
Kubernetes ServiceAccount for Fabric worker
This ServiceAccount is created in the org-specific namespace and is used by fabric workers
to authenticate with Kubernetes APIs for deploying and managing fabric components.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fabric.serviceAccountName" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric.commonLabels" . | nindent 4 }}

---

{{- /*
Kubernetes Role granting full permissions in the organization namespace
This role allows the fabric worker to create, update, and delete all resources
necessary for deploying fabric components (deployments, services, configmaps, secrets, etc.)
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fabric.roleName" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]

---

{{- /*
RoleBinding connects the ServiceAccount to the Role
This grants the fabric worker all permissions defined in the role within the organization namespace.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fabric.roleName" . }}
  namespace: {{ include "fabric.namespace" . }}
  labels:
    {{- include "fabric.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fabric.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fabric.serviceAccountName" . }}
    namespace: {{ include "fabric.namespace" . }}


