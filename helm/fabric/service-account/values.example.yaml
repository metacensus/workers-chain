# Namespace where the ServiceAccount will be created
# ("fabric-shard-{org}" for shard workers, "fabric" for the shared fabric worker)
namespace: fabric-shard-example-org

# ServiceAccount name for the worker in this namespace
serviceAccountName: fabric-worker-example-org

# Role name for RBAC permissions
roleName: fabric-worker-example-org

# Common labels to apply to all resources
commonLabels:
  managedBy: helm
  partOf: fabric


