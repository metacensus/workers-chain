{{- /*
Certificate Authority Service Account
Provides identity for the CA pod to authenticate with Vault via Kubernetes auth
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "certificate-authority.name" . }}
  namespace: {{ include "certificate-authority.namespace" . }}
  labels:
    {{- include "certificate-authority.commonLabels" . | nindent 4 }}




