{{- /*
Certificate Authority SecretProviderClass
Configures Vault CSI driver to fetch secrets for the CA.

Keys (private) and certs (public) are stored at separate Vault paths:
- Keys: keys/ca/{chain}/{id}/... (signing, tls, credentials)
- Certs: certs/ca/{chain}/{id}/... (signing, tls) - each contains {certificate, chain}

Certificate chains are pre-built at enrollment time and stored in the "chain" key.
The chain contains: [leaf cert] + [issuing CA's chain] for x509 verification.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "certificate-authority.name" . }}-vault
  namespace: {{ include "certificate-authority.namespace" . }}
  labels:
    {{- include "certificate-authority.commonLabels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.secrets.svc.cluster.local:8200"
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      # CA Signing Identity - separate key and cert paths
      - objectName: "signing-private-key"
        secretPath: {{ .Values.vault.signingKeyPath | quote }}
        secretKey: "private_key"
      - objectName: "signing-cert"
        secretPath: {{ .Values.vault.signingCertPath | quote }}
        secretKey: "certificate"
      # CA Signing Chain (for intermediate CAs to verify client cert chains)
      # Root CAs will have chain = leaf cert only
      - objectName: "signing-chain"
        secretPath: {{ .Values.vault.signingCertPath | quote }}
        secretKey: "chain"
      # CA TLS Identity - separate key and cert paths
      - objectName: "tls-private-key"
        secretPath: {{ .Values.vault.tlsKeyPath | quote }}
        secretKey: "private_key"
      - objectName: "tls-cert"
        secretPath: {{ .Values.vault.tlsCertPath | quote }}
        secretKey: "certificate"
      - objectName: "tls-chain"
        secretPath: {{ .Values.vault.tlsCertPath | quote }}
        secretKey: "chain"
      # Bootstrap Admin Credentials (username, password) - under keys/
      - objectName: "admin-username"
        secretPath: {{ .Values.vault.adminCredentialsPath | quote }}
        secretKey: "username"
      - objectName: "admin-password"
        secretPath: {{ .Values.vault.adminCredentialsPath | quote }}
        secretKey: "password"
      # Database Credentials (username, password) - under keys/
      - objectName: "db-username"
        secretPath: {{ .Values.vault.dbCredentialsPath | quote }}
        secretKey: "username"
      - objectName: "db-password"
        secretPath: {{ .Values.vault.dbCredentialsPath | quote }}
        secretKey: "password"
  # Sync secrets to Kubernetes Secret for easier consumption
  secretObjects:
  - secretName: {{ include "certificate-authority.name" . }}-secret
    type: Opaque
    data:
    - objectName: "signing-private-key"
      key: "signing-private-key"
    - objectName: "signing-cert"
      key: "signing-cert"
    - objectName: "signing-chain"
      key: "signing-chain"
    - objectName: "tls-private-key"
      key: "tls-private-key"
    - objectName: "tls-cert"
      key: "tls-cert"
    - objectName: "tls-chain"
      key: "tls-chain"
    - objectName: "admin-username"
      key: "admin-username"
    - objectName: "admin-password"
      key: "admin-password"
    - objectName: "db-username"
      key: "db-username"
    - objectName: "db-password"
      key: "db-password"
