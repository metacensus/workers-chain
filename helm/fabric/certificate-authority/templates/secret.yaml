{{- /*
Certificate Authority SecretProviderClass
Configures Vault CSI driver to fetch secrets for the CA:
- Signing private key and certificate (for issuing certificates)
- Signing chain (for intermediate CAs to verify client certs)
- TLS private key and certificate (for HTTPS endpoint)
- Bootstrap admin credentials
- Database credentials
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "certificate-authority.name" . }}-vault
  namespace: {{ include "certificate-authority.namespace" . }}
  labels:
    {{- include "certificate-authority.commonLabels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.secrets.svc.cluster.local:8200"
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      # CA Signing Identity (for issuing certificates)
      - objectName: "signing-private-key"
        secretPath: {{ .Values.vault.signingPath | quote }}
        secretKey: "private_key"
      - objectName: "signing-cert"
        secretPath: {{ .Values.vault.signingPath | quote }}
        secretKey: "certificate"
      {{- if .Values.vault.signingChainPath }}
      # CA Signing Chain (for intermediate CAs to verify client cert chains)
      - objectName: "signing-chain"
        secretPath: {{ .Values.vault.signingChainPath | quote }}
        secretKey: "chain"
      {{- end }}
      # CA TLS Identity (for HTTPS endpoint)
      - objectName: "tls-private-key"
        secretPath: {{ .Values.vault.tlsPath | quote }}
        secretKey: "private_key"
      - objectName: "tls-cert"
        secretPath: {{ .Values.vault.tlsPath | quote }}
        secretKey: "certificate"
      # Bootstrap Admin Credentials (username, password)
      - objectName: "admin-username"
        secretPath: {{ .Values.vault.adminCredentialsPath | quote }}
        secretKey: "username"
      - objectName: "admin-password"
        secretPath: {{ .Values.vault.adminCredentialsPath | quote }}
        secretKey: "password"
      # Database Credentials (username, password)
      - objectName: "db-username"
        secretPath: {{ .Values.vault.dbCredentialsPath | quote }}
        secretKey: "username"
      - objectName: "db-password"
        secretPath: {{ .Values.vault.dbCredentialsPath | quote }}
        secretKey: "password"
  # Sync secrets to Kubernetes Secret for easier consumption
  secretObjects:
  - secretName: {{ include "certificate-authority.name" . }}-secret
    type: Opaque
    data:
    - objectName: "signing-private-key"
      key: "signing-private-key"
    - objectName: "signing-cert"
      key: "signing-cert"
    {{- if .Values.vault.signingChainPath }}
    - objectName: "signing-chain"
      key: "signing-chain"
    {{- end }}
    - objectName: "tls-private-key"
      key: "tls-private-key"
    - objectName: "tls-cert"
      key: "tls-cert"
    - objectName: "admin-username"
      key: "admin-username"
    - objectName: "admin-password"
      key: "admin-password"
    - objectName: "db-username"
      key: "db-username"
    - objectName: "db-password"
      key: "db-password"
