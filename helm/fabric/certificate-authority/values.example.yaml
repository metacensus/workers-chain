# Example values for Certificate Authority deployment

org: "org1"

certType: "tls"  # or "org"
caId: "root"     # "root" for root CA, or "v1", "v2" for intermediates

image:
  repository: hyperledger/fabric-ca
  tag: "1.5"
  pullPolicy: IfNotPresent

replicas: 1

database:
  host: "certificate-store.fabric-org1.svc.cluster.local"
  port: 5432
  name: "fabric_org1_ca_tls_root"

vault:
  roleName: "fabric-org1-certificate-authority-tls-root"
  keyPairPath: "secret/data/fabric/org1/ca/tls/root/keys"
  certificatePath: "secret/data/fabric/org1/ca/tls/root/cert"
  adminCredentialsPath: "secret/data/fabric/org1/ca/tls/root/admin/credentials"
  dbCredentialsPath: "secret/data/fabric/org1/ca/tls/root/certstore/user/credentials"

service:
  type: ClusterIP
  port: 7054

ca:
  commonName: "certificate-authority-tls-root"
  organizationalUnit: "root-ca"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

commonLabels:
  managedBy: "temporal-workflows"
  partOf: "fabric-infrastructure"




