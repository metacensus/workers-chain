# Example values for Certificate Authority deployment

# Owner identifier: the operator (e.g., "metacensus") for shared TLS CAs,
# or the organization (e.g., "org1") for org CAs
org: "metacensus"

# Kubernetes namespace: "fabric" for operator-owned TLS CAs,
# "fabric-shard-{org}" for org-owned CAs
namespace: "fabric"

certType: "tls"  # or "org"
caId: "root"     # "root" for root CA, or "int" for intermediates

image:
  repository: hyperledger/fabric-ca
  tag: "1.5"
  pullPolicy: IfNotPresent

replicas: 1

database:
  host: "certificate-store.fabric.svc.cluster.local"
  port: 5432
  name: "fabric_metacensus_ca_tls_root"

# Vault paths follow the owner's tree: "fabric/{operator}/..." for operator-owned
# TLS CAs (shown here), "fabric/shard/{org}/..." for org-owned CAs
vault:
  roleName: "fabric-metacensus-certificate-authority-tls-root"
  # Keys (private) - separate paths for private keys
  signingKeyPath: "secret/data/fabric/metacensus/keys/ca/tls/root/signing"
  tlsKeyPath: "secret/data/fabric/metacensus/keys/ca/tls/root/tls"
  # Certs (public) - separate paths for certificates + chains
  signingCertPath: "secret/data/fabric/metacensus/certs/ca/tls/root/signing"
  tlsCertPath: "secret/data/fabric/metacensus/certs/ca/tls/root/tls"
  # Bootstrap admin credentials (username/password)
  adminCredentialsPath: "secret/data/fabric/metacensus/keys/ca/tls/root/bootstrap-admin/credentials"
  # Database credentials (username/password)
  dbCredentialsPath: "secret/data/fabric/metacensus/keys/ca/tls/root/certstore"

service:
  type: ClusterIP
  port: 7054

ca:
  commonName: "certificate-authority-tls-root"
  organizationalUnit: "root-ca"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

commonLabels:
  managedBy: "temporal-workflows"
  partOf: "fabric-infrastructure"
