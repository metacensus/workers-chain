# Example values for Certificate Authority deployment

org: "org1"

certType: "tls"  # or "org"
caId: "root"     # "root" for root CA, or "v1", "v2" for intermediates

image:
  repository: hyperledger/fabric-ca
  tag: "1.5"
  pullPolicy: IfNotPresent

replicas: 1

database:
  host: "certificate-store.fabric-org1.svc.cluster.local"
  port: 5432
  name: "fabric_org1_ca_tls_root"

vault:
  roleName: "fabric-org1-certificate-authority-tls-root"
  # Signing path: CA's signing keypair + certificate (for issuing certs)
  signingPath: "secret/data/fabric/org1/ca/tls/root/signing"
  # Signing chain path: Parent CA chain (for intermediate CAs only, omit for root CAs)
  # This enables intermediate CAs to verify client certificate chains
  # Example for intermediate: signingChainPath: "secret/data/fabric/org1/ca/tls/v1/signing-chain"
  # TLS path: CA's TLS keypair + certificate (for HTTPS endpoint)
  tlsPath: "secret/data/fabric/org1/ca/tls/root/tls"
  # Bootstrap admin credentials (username/password)
  adminCredentialsPath: "secret/data/fabric/org1/ca/tls/root/bootstrap-admin/credentials"
  # Database credentials (username/password)
  dbCredentialsPath: "secret/data/fabric/org1/ca/tls/root/certstore/user"

service:
  type: ClusterIP
  port: 7054

ca:
  commonName: "certificate-authority-tls-root"
  organizationalUnit: "root-ca"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

commonLabels:
  managedBy: "temporal-workflows"
  partOf: "fabric-infrastructure"
