# Example values file for MetaCensus organization deployment
# This demonstrates a production-like configuration

organization:
  id: "metacensus"
  mspId: "MetaCensusMSP"

# Deploy single CA
ca:
  count: 1
  image:
    repository: hyperledger/fabric-ca
    tag: "1.5.5"
  certSecrets:
    - "metacensus-ca-0-certs"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Deploy 2 peers (each with dedicated CouchDB)
peer:
  count: 2
  image:
    repository: hyperledger/fabric-peer
    tag: "2.5.0"
  certSecrets:
    - "metacensus-peer-0-certs"
    - "metacensus-peer-1-certs"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  tls:
    enabled: true
    clientAuthRequired: false

# CouchDB will be deployed automatically (2 instances)
couchdb:
  image:
    repository: couchdb
    tag: "3.3.2"
  user: "admin"
  password: "adminpw"  # TODO: Replace with secret reference in production
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Deploy 3 orderers for Raft consensus
orderer:
  count: 3
  image:
    repository: hyperledger/fabric-orderer
    tag: "2.5.0"
  mspId: "MetaCensusOrdererMSP"
  certSecrets:
    - "metacensus-orderer-0-certs"
    - "metacensus-orderer-1-certs"
    - "metacensus-orderer-2-certs"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  tls:
    enabled: true
    clientAuthRequired: false

# Common labels for all resources
commonLabels:
  environment: "production"
  team: "infrastructure"
  managed-by: "temporal-workflow"

