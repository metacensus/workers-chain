version: v2
managed:
  enabled: true
plugins:
  # Generate standard Go protobuf types
  - local: protoc-gen-go
    out: gen/workflows
    opt:
      - paths=source_relative
  # Generate Temporal workflow/activity stubs
  - local: protoc-gen-go_temporal
    out: gen/workflows
    opt:
      - docs-out=./proto/README.md
      - paths=source_relative
    strategy: all
inputs:
  - directory: proto/workflows