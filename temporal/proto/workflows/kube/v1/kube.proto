// UpdateSummary provides aggregate statistics
message UpdateSummary {
  int32 total = 1 [
    json_name = "Total",
    (go.field).tags = 'json:"Total" validate:"required"'
  ];
  int32 updated = 2 [
    json_name = "Updated",
    (go.field).tags = 'json:"Updated" validate:"required"'
  ];
  int32 failed = 3 [
    json_name = "Failed",
    (go.field).tags = 'json:"Failed" validate:"required"'
  ];
}

// ApplyInput defines inputs for the Apply activity
message ApplyInput {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1 [
    json_name = "Resources",
    (go.field).tags = 'json:"Resources" validate:"required"'
  ];
}

// ApplyOutput represents the result of applying resources
message ApplyOutput {
  // results contains the outcome for each resource
  // Keys match the resource_id from ApplyInput
  map<string, ApplyResult> results = 1 [
    json_name = "Results",
    (go.field).tags = 'json:"Results" validate:"required"'
  ];
  
  // summary provides high-level statistics
  ApplySummary summary = 2 [
    json_name = "Summary",
    (go.field).tags = 'json:"Summary" validate:"required"'
  ];
}

// ApplyResult represents the outcome of applying a single resource
message ApplyResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1 [
    json_name = "ResourceId",
    (go.field).tags = 'json:"ResourceId" validate:"required"'
  ];
  
  // resource_status contains current state (if applied successfully)
  ResourceStatus resource_status = 2 [
    json_name = "ResourceStatus",
    (go.field).tags = 'json:"ResourceStatus,omitempty" validate:"omitempty"'
  ];
  
  // error_message contains error details (if failed)
  string error_message = 3 [
    json_name = "ErrorMessage",
    (go.field).tags = 'json:"ErrorMessage,omitempty" validate:"omitempty"'
  ];
}

// ApplySummary provides aggregate statistics
message ApplySummary {
  int32 total = 1 [
    json_name = "Total",
    (go.field).tags = 'json:"Total" validate:"required"'
  ];
  int32 applied = 2 [
    json_name = "Applied",
    (go.field).tags = 'json:"Applied" validate:"required"'
  ];
  int32 failed = 3 [
    json_name = "Failed",
    (go.field).tags = 'json:"Failed" validate:"required"'
  ];
}

// DeleteInput defines inputs for the Delete activity
message DeleteInput {
  // resources to delete
  // Keys are resource_id (same as ApplyInput)
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1 [
    json_name = "Resources",
    (go.field).tags = 'json:"Resources" validate:"required"'
  ];
}

// DeleteOutput represents the result of deleting resources
message DeleteOutput {
  // results contains the outcome for each resource
  map<string, DeleteResult> results = 1 [
    json_name = "Results",
    (go.field).tags = 'json:"Results" validate:"required"'
  ];
  
  // summary provides high-level statistics
  DeleteSummary summary = 2 [
    json_name = "Summary",
    (go.field).tags = 'json:"Summary" validate:"required"'
  ];
}

// DeleteResult represents the outcome of deleting a single resource
message DeleteResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1 [
    json_name = "ResourceId",
    (go.field).tags = 'json:"ResourceId" validate:"required"'
  ];
  
  // error_message contains error details (if failed)
  string error_message = 2 [
    json_name = "ErrorMessage",
    (go.field).tags = 'json:"ErrorMessage,omitempty" validate:"omitempty"'
  ];
}

// DeleteSummary provides aggregate statistics
message DeleteSummary {
  int32 total = 1 [
    json_name = "Total",
    (go.field).tags = 'json:"Total" validate:"required"'
  ];
  int32 deleted = 2 [
    json_name = "Deleted",
    (go.field).tags = 'json:"Deleted" validate:"required"'
  ];
  int32 failed = 3 [
    json_name = "Failed",
    (go.field).tags = 'json:"Failed" validate:"required"'
  ];
}

// GetStatusInput queries the status of deployed resources
message GetStatusInput {
  // resources to check status for
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1 [
    json_name = "Resources",
    (go.field).tags = 'json:"Resources" validate:"required"'
  ];
}

// GetStatusOutput represents the current status of resources
message GetStatusOutput {
  // results contains status for each resource
  // Keys match resource_id from GetStatusInput
  map<string, ResourceStatus> results = 1 [
    json_name = "Results",
    (go.field).tags = 'json:"Results" validate:"required"'
  ];
  
  // overall_status is a summary: "ready", "pending", "degraded", "error", "unknown"
  string overall_status = 2 [
    json_name = "OverallStatus",
    (go.field).tags = 'json:"OverallStatus" validate:"required"'
  ];
}

// ResourceIdentifier uniquely identifies a Kubernetes resource
message ResourceIdentifier {
  // api_version is the Kubernetes API version (e.g., "apps/v1", "v1")
  string api_version = 1 [
    json_name = "ApiVersion",
    (go.field).tags = 'json:"ApiVersion" validate:"required"'
  ];
  
  // kind is the Kubernetes resource kind (e.g., "Deployment", "Service", "Pod")
  string kind = 2 [
    json_name = "Kind",
    (go.field).tags = 'json:"Kind" validate:"required"'
  ];
  
  // name is the resource name
  string name = 3 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
  
  // namespace is the resource namespace
  // Empty for cluster-scoped resources
  string namespace = 4 [
    json_name = "Namespace",
    (go.field).tags = 'json:"Namespace,omitempty" validate:"omitempty"'
  ];
}

// ResourceStatus represents the status of a single Kubernetes resource
message ResourceStatus {
  // kind is the Kubernetes resource kind (e.g., "Deployment", "Pod", "Service")
  string kind = 1 [
    json_name = "Kind",
    (go.field).tags = 'json:"Kind" validate:"required"'
  ];
  
  // name is the resource name
  string name = 2 [
    json_name = "Name",
    (go.field).tags = 'json:"Name" validate:"required"'
  ];
  
  // namespace is the resource namespace
  string namespace = 3 [
    json_name = "Namespace",
    (go.field).tags = 'json:"Namespace" validate:"required"'
  ];
  
  // status is the current status (e.g., "ready", "pending", "error", "unknown")
  string status = 4 [
    json_name = "Status",
    (go.field).tags = 'json:"Status" validate:"required"'
  ];
  
  // ready_replicas is the number of ready replicas (for Deployments, StatefulSets, etc.)
  // Only populated for workload resources
  int32 ready_replicas = 5 [
    json_name = "ReadyReplicas",
    (go.field).tags = 'json:"ReadyReplicas,omitempty" validate:"omitempty"'
  ];
  
  // desired_replicas is the desired number of replicas
  // Only populated for workload resources
  int32 desired_replicas = 6 [
    json_name = "DesiredReplicas",
    (go.field).tags = 'json:"DesiredReplicas,omitempty" validate:"omitempty"'
  ];
  
  // message provides additional context (error messages, warnings, etc.)
  string message = 7 [
    json_name = "Message",
    (go.field).tags = 'json:"Message,omitempty" validate:"omitempty"'
  ];
}

