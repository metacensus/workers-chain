syntax = "proto3";

package kube.v1;

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/kube/v1;kubev1";

import "temporal/v1/temporal.proto";

// Kubernetes defines activities for deploying resources to Kubernetes
// Activities work with pre-rendered YAML manifests (from Helm, Kustomize, or plain YAML)
// Caller is responsible for templating/rendering before calling these activities
service Kubernetes {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {
    task_queue: "kube"
  };

  // Create creates new resources in the cluster (fails if already exists)
  rpc Create(CreateRequest) returns (CreateResponse) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kubernetes.Create"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Update updates existing resources in the cluster (fails if not found)
  rpc Update(UpdateRequest) returns (UpdateResponse) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kubernetes.Update"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Apply deploys resources to the cluster (create or update)
  rpc Apply(ApplyRequest) returns (ApplyResponse) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kubernetes.Apply"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Delete removes resources from the cluster
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kubernetes.Delete"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

  // GetStatus retrieves the current status of deployed resources
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kubernetes.GetStatus"
      schedule_to_close_timeout: {seconds: 60}
    };
  }
}

// Resource represents a single Kubernetes resource as YAML
// Activities parse the YAML to extract metadata before applying
message Resource {
  // manifest_yaml is the complete YAML definition of the resource
  // Activities parse this to extract kind, name, namespace, apiVersion
  bytes manifest_yaml = 1;
}

// CreateRequest defines inputs for the Create activity
message CreateRequest {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1;
}

// CreateResponse represents the result of creating resources
message CreateResponse {
  // results contains the outcome for each resource
  // Keys match the resource_id from CreateRequest
  map<string, CreateResult> results = 1;
  
  // summary provides high-level statistics
  CreateSummary summary = 2;
}

// CreateResult represents the outcome of creating a single resource
message CreateResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1;
  
  // resource_status contains current state (if created successfully)
  ResourceStatus resource_status = 2;
  
  // error_message contains error details (if failed)
  string error_message = 3;
}

// CreateSummary provides aggregate statistics
message CreateSummary {
  int32 total = 1;
  int32 created = 2;
  int32 failed = 3;
}

// UpdateRequest defines inputs for the Update activity
message UpdateRequest {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1;
}

// UpdateResponse represents the result of updating resources
message UpdateResponse {
  // results contains the outcome for each resource
  // Keys match the resource_id from UpdateRequest
  map<string, UpdateResult> results = 1;
  
  // summary provides high-level statistics
  UpdateSummary summary = 2;
}

// UpdateResult represents the outcome of updating a single resource
message UpdateResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1;
  
  // resource_status contains current state (if updated successfully)
  ResourceStatus resource_status = 2;
  
  // error_message contains error details (if failed)
  string error_message = 3;
}

// UpdateSummary provides aggregate statistics
message UpdateSummary {
  int32 total = 1;
  int32 updated = 2;
  int32 failed = 3;
}

// ApplyRequest defines inputs for the Apply activity
message ApplyRequest {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1;
}

// ApplyResponse represents the result of applying resources
message ApplyResponse {
  // results contains the outcome for each resource
  // Keys match the resource_id from ApplyRequest
  map<string, ApplyResult> results = 1;
  
  // summary provides high-level statistics
  ApplySummary summary = 2;
}

// ApplyResult represents the outcome of applying a single resource
message ApplyResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1;
  
  // resource_status contains current state (if applied successfully)
  ResourceStatus resource_status = 2;
  
  // error_message contains error details (if failed)
  string error_message = 3;
}

// ApplySummary provides aggregate statistics
message ApplySummary {
  int32 total = 1;
  int32 applied = 2;
  int32 failed = 3;
}

// DeleteRequest defines inputs for the Delete activity
message DeleteRequest {
  // resources to delete
  // Keys are resource_id (same as ApplyRequest)
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1;
}

// DeleteResponse represents the result of deleting resources
message DeleteResponse {
  // results contains the outcome for each resource
  map<string, DeleteResult> results = 1;
  
  // summary provides high-level statistics
  DeleteSummary summary = 2;
}

// DeleteResult represents the outcome of deleting a single resource
message DeleteResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1;
  
  // error_message contains error details (if failed)
  string error_message = 2;
}

// DeleteSummary provides aggregate statistics
message DeleteSummary {
  int32 total = 1;
  int32 deleted = 2;
  int32 failed = 3;
}

// GetStatusRequest queries the status of deployed resources
message GetStatusRequest {
  // resources to check status for
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1;
}

// GetStatusResponse represents the current status of resources
message GetStatusResponse {
  // results contains status for each resource
  // Keys match resource_id from GetStatusRequest
  map<string, ResourceStatus> results = 1;
  
  // overall_status is a summary: "ready", "pending", "degraded", "error", "unknown"
  string overall_status = 2;
}

// ResourceIdentifier uniquely identifies a Kubernetes resource
message ResourceIdentifier {
  // api_version is the Kubernetes API version (e.g., "apps/v1", "v1")
  string api_version = 1;
  
  // kind is the Kubernetes resource kind (e.g., "Deployment", "Service", "Pod")
  string kind = 2;
  
  // name is the resource name
  string name = 3;
  
  // namespace is the resource namespace
  // Empty for cluster-scoped resources
  string namespace = 4;
}

// ResourceStatus represents the status of a single Kubernetes resource
message ResourceStatus {
  // kind is the Kubernetes resource kind (e.g., "Deployment", "Pod", "Service")
  string kind = 1;
  
  // name is the resource name
  string name = 2;
  
  // namespace is the resource namespace
  string namespace = 3;
  
  // status is the current status (e.g., "ready", "pending", "error", "unknown")
  string status = 4;
  
  // ready_replicas is the number of ready replicas (for Deployments, StatefulSets, etc.)
  // Only populated for workload resources
  int32 ready_replicas = 5;
  
  // desired_replicas is the desired number of replicas
  // Only populated for workload resources
  int32 desired_replicas = 6;
  
  // message provides additional context (error messages, warnings, etc.)
  string message = 7;
}

