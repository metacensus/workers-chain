syntax = "proto3";

package kube.v1;

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/kube/v1;kubev1";

import "patch/go.proto";
import "temporal/v1/temporal.proto";

// Kubernetes defines activities for deploying resources to Kubernetes
// Activities work with pre-rendered YAML manifests (from Helm, Kustomize, or plain YAML)
// Caller is responsible for templating/rendering before calling these activities
service Kubernetes {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {
    task_queue: "infra"
  };
  // namespace parameter is used for security enforcement

  // Create creates new resources in the cluster (fails if already exists)
  rpc Create(CreateInput) returns (CreateOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kube.v1.Create"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Update updates existing resources in the cluster (fails if not found)
  rpc Update(UpdateInput) returns (UpdateOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kube.v1.Update"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Apply deploys resources to the cluster (create or update)
  rpc Apply(ApplyInput) returns (ApplyOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kube.v1.Apply"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // Delete removes resources from the cluster
  rpc Delete(DeleteInput) returns (DeleteOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kube.v1.Delete"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

  // GetStatus retrieves the current status of deployed resources
  rpc GetStatus(GetStatusInput) returns (GetStatusOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "kube.v1.GetStatus"
      schedule_to_close_timeout: {seconds: 60}
    };
  }
}

// Resource represents a single Kubernetes resource as YAML
// Activities parse the YAML to extract metadata before applying
message Resource {
  // manifest_yaml is the complete YAML definition of the resource
  // Activities parse this to extract kind, name, namespace, apiVersion
  bytes manifest_yaml = 1 [
    json_name = "ManifestYaml",
    (go.field).tags = 'json:"ManifestYaml" validate:"required"'
  ];
}

// CreateInput defines inputs for the Create activity
message CreateInput {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1 [
    json_name = "Resources",
    (go.field).tags = 'json:"Resources" validate:"required"'
  ];
}

// CreateOutput represents the result of creating resources
message CreateOutput {
  // results contains the outcome for each resource
  // Keys match the resource_id from CreateInput
  map<string, CreateResult> results = 1 [
    json_name = "Results",
    (go.field).tags = 'json:"Results" validate:"required"'
  ];
  
  // summary provides high-level statistics
  CreateSummary summary = 2 [
    json_name = "Summary",
    (go.field).tags = 'json:"Summary" validate:"required"'
  ];
}

// CreateResult represents the outcome of creating a single resource
message CreateResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1 [
    json_name = "ResourceId",
    (go.field).tags = 'json:"ResourceId" validate:"required"'
  ];
  
  // resource_status contains current state (if created successfully)
  ResourceStatus resource_status = 2 [
    json_name = "ResourceStatus",
    (go.field).tags = 'json:"ResourceStatus,omitempty" validate:"omitempty"'
  ];
  
  // error_message contains error details (if failed)
  string error_message = 3 [
    json_name = "ErrorMessage",
    (go.field).tags = 'json:"ErrorMessage,omitempty" validate:"omitempty"'
  ];
}

// CreateSummary provides aggregate statistics
message CreateSummary {
  int32 total = 1 [
    json_name = "Total",
    (go.field).tags = 'json:"Total" validate:"required"'
  ];
  int32 created = 2 [
    json_name = "Created",
    (go.field).tags = 'json:"Created" validate:"required"'
  ];
  int32 failed = 3 [
    json_name = "Failed",
    (go.field).tags = 'json:"Failed" validate:"required"'
  ];
}

// UpdateInput defines inputs for the Update activity
message UpdateInput {
  // resources is a map of resource_id → resource
  // resource_id is caller-defined for tracking (e.g., "deployment-api", "service-api")
  // Each resource's YAML must include namespace (or be cluster-scoped)
  map<string, Resource> resources = 1 [
    json_name = "Resources",
    (go.field).tags = 'json:"Resources" validate:"required"'
  ];
}

// UpdateOutput represents the result of updating resources
message UpdateOutput {
  // results contains the outcome for each resource
  // Keys match the resource_id from UpdateInput
  map<string, UpdateResult> results = 1 [
    json_name = "Results",
    (go.field).tags = 'json:"Results" validate:"required"'
  ];
  
  // summary provides high-level statistics
  UpdateSummary summary = 2 [
    json_name = "Summary",
    (go.field).tags = 'json:"Summary" validate:"required"'
  ];
}

// UpdateResult represents the outcome of updating a single resource
message UpdateResult {
  // resource_id identifies which resource this result is for
  string resource_id = 1 [
    json_name = "ResourceId",
    (go.field).tags = 'json:"ResourceId" validate:"required"'
  ];
  
  // resource_status contains current state (if updated successfully)
  ResourceStatus resource_status = 2 [
    json_name = "ResourceStatus",
    (go.field).tags = 'json:"ResourceStatus,omitempty" validate:"omitempty"'
  ];
  
  // error_message contains error details (if failed)
  string error_message = 3 [
