syntax = "proto3";

package postgres.v1;

import "patch/go.proto";
import "temporal/v1/temporal.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/postgres/v1;postgresv1";

// Postgres service defines activities for PostgreSQL database management
service Postgres {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // CreateDatabase creates a new PostgreSQL database
  // Idempotent: returns success if database already exists
  rpc CreateDatabase(CreateDatabaseInput) returns (CreateDatabaseOutput) {
    option (temporal.v1.activity) = {
      name: "postgres.v1.CreateDatabase"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }

  // CreateUser creates a new PostgreSQL user
  // Idempotent: returns success if user already exists
  rpc CreateUser(CreateUserInput) returns (CreateUserOutput) {
    option (temporal.v1.activity) = {
      name: "postgres.v1.CreateUser"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }

  // GrantPrivileges grants privileges to a user on a database
  // Idempotent: can be called multiple times safely
  rpc GrantPrivileges(GrantPrivilegesInput) returns (GrantPrivilegesOutput) {
    option (temporal.v1.activity) = {
      name: "postgres.v1.GrantPrivileges"
      schedule_to_close_timeout: {seconds: 300} /* 5 minutes */
    };
  }
}

// ==================== Database Messages ====================

// CreateDatabaseInput specifies parameters for creating a database
message CreateDatabaseInput {
  // database_name is the name of the database to create
  string database_name = 1 [
    json_name = "DatabaseName",
    (go.field).tags = 'json:"DatabaseName" validate:"required"'
  ];
}

// CreateDatabaseOutput confirms database creation
message CreateDatabaseOutput {
  // Empty - database creation confirmed by successful return
}

// ==================== User Messages ====================

// CreateUserInput specifies parameters for creating a user
message CreateUserInput {
  // username is the name of the user to create
  string username = 1 [
    json_name = "Username",
    (go.field).tags = 'json:"Username" validate:"required"'
  ];

  // password is the password for the user
  string password = 2 [
    json_name = "Password",
    (go.field).tags = 'json:"Password" validate:"required"'
  ];
}

// CreateUserOutput confirms user creation
message CreateUserOutput {
  // Empty - user creation confirmed by successful return
}

// ==================== Privilege Messages ====================

// Privilege enum for PostgreSQL database permissions
enum Privilege {
  PRIVILEGE_UNSPECIFIED = 0;
  PRIVILEGE_ALL = 1; // All available privileges
  PRIVILEGE_SELECT = 2; // Query data
  PRIVILEGE_INSERT = 3; // Insert data
  PRIVILEGE_UPDATE = 4; // Update data
  PRIVILEGE_DELETE = 5; // Delete data
  PRIVILEGE_TRUNCATE = 6; // Truncate tables
  PRIVILEGE_REFERENCES = 7; // Create foreign key constraints
  PRIVILEGE_TRIGGER = 8; // Create triggers
  PRIVILEGE_CREATE = 9; // Create schemas/tables
  PRIVILEGE_CONNECT = 10; // Connect to database
  PRIVILEGE_TEMPORARY = 11; // Create temporary tables
  PRIVILEGE_EXECUTE = 12; // Execute functions
  PRIVILEGE_USAGE = 13; // Use schemas/sequences
}

// GrantPrivilegesInput specifies parameters for granting privileges
message GrantPrivilegesInput {
  // username is the name of the user to grant privileges to
  string username = 1 [
    json_name = "Username",
    (go.field).tags = 'json:"Username" validate:"required"'
  ];

  // database_name is the name of the database to grant privileges on
  string database_name = 2 [
    json_name = "DatabaseName",
    (go.field).tags = 'json:"DatabaseName" validate:"required"'
  ];

  // privileges is a list of privileges to grant
  // If empty, defaults to [PRIVILEGE_ALL]
  repeated Privilege privileges = 3 [
    json_name = "Privileges",
    (go.field).tags = 'json:"Privileges,omitempty" validate:"omitempty"'
  ];
}

// GrantPrivilegesOutput confirms successful privilege grant
message GrantPrivilegesOutput {
  // Empty - privilege grant confirmed by successful return
}
