syntax = "proto3";

package cluster.fabric.v1;

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/cluster/v1;clusterfabricv1";

import "temporal/v1/temporal.proto";

// Cluster defines workflows for infrastructure provisioning on Kubernetes
// These workflows orchestrate the creation and management of cluster resources
// by composing Helm (for templating) and Kubernetes (for deployment) activities
service Cluster {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {
    task_queue: "infra"
  };

  // CreateNamespace orchestrates the creation of a Kubernetes namespace
  // This workflow combines Helm chart rendering with Kubernetes resource application
  rpc CreateNamespace(CreateNamespaceInput) returns (CreateNamespaceOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateNamespace"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateServiceAccount orchestrates the creation of a Kubernetes service account
  // This workflow renders a Helm chart template for service account configuration,
  // then applies the resulting resources to the cluster
  rpc CreateServiceAccount(CreateServiceAccountInput) returns (CreateServiceAccountOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateServiceAccount"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateDeployment orchestrates the deployment of a single resource to Kubernetes
  // This workflow renders a Helm chart with provided values and applies it to the cluster
  rpc CreateDeployment(CreateDeploymentInput) returns (CreateDeploymentOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateDeployment"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }
}

// ==================== CreateNamespace Workflow Messages ====================

message CreateNamespaceInput {
  // org is the organization identifier (e.g., "org1")
  // The namespace will be named "fabric-{org}"
  string org = 1;
}

message CreateNamespaceOutput {
  // namespace_name is the created namespace (e.g., "fabric-org1")
  string namespace_name = 1;
}

// ==================== CreateServiceAccount Workflow Messages ====================

message CreateServiceAccountInput {
  string org = 1;
}

message CreateServiceAccountOutput {}

// ==================== CreateDeployment Workflow Messages ====================

message CreateDeploymentInput {}

message CreateDeploymentOutput {}

