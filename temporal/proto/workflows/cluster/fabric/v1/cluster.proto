syntax = "proto3";

package cluster.fabric.v1;

import "patch/go.proto";
import "temporal/v1/temporal.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/cluster/fabric/v1;clusterfabricv1";

// Cluster defines workflows for infrastructure provisioning on Kubernetes
// These workflows orchestrate the creation and management of cluster resources
// by composing Helm (for templating) and Kubernetes (for deployment) activities
service Cluster {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // CreateNamespace orchestrates the creation of a Kubernetes namespace
  // This workflow combines Helm chart rendering with Kubernetes resource application
  rpc CreateNamespace(CreateNamespaceInput) returns (CreateNamespaceOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateNamespace"
      id: 'cluster/fabric/create-namespace/${! Org }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateServiceAccount orchestrates the creation of a Kubernetes service account
  // This workflow renders a Helm chart template for service account configuration,
  // then applies the resulting resources to the cluster
  rpc CreateServiceAccount(CreateServiceAccountInput) returns (CreateServiceAccountOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateServiceAccount"
      id: 'cluster/fabric/create-service-account/${! Org }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateDeployment orchestrates the deployment of a single resource to Kubernetes
  // This workflow renders a Helm chart with provided values and applies it to the cluster
  rpc CreateDeployment(CreateDeploymentInput) returns (CreateDeploymentOutput) {
    // Workflow execution metadata
    option (temporal.v1.workflow) = {
      name: "cluster.fabric.v1.CreateDeployment"
      id: 'cluster/fabric/create-deployment/${! Org }/${! Component }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }
}

// ==================== CreateNamespace Workflow Messages ====================

message CreateNamespaceInput {
  // org is the owner identifier: an organization (e.g., "org1") or, when
  // is_operator is true, the operator (e.g., "metacensus").
  // Org namespaces are named "fabric-shard-{org}"; the operator namespace is "fabric".
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // is_operator indicates whether this is the operator namespace
  // When true, network policies will be created to allow cross-namespace
  // access from fabric shard namespaces to TLS CA services on port 7054
  bool is_operator = 2 [
    json_name = "IsOperator",
    (go.field).tags = 'json:"IsOperator,omitempty"'
  ];
}

message CreateNamespaceOutput {
  // namespace_name is the created namespace (e.g., "fabric-shard-org1" or "fabric")
  string namespace_name = 1 [
    json_name = "NamespaceName",
    (go.field).tags = 'json:"NamespaceName" validate:"required"'
  ];
}

// ==================== CreateServiceAccount Workflow Messages ====================

message CreateServiceAccountInput {
  // org is the owner identifier: an organization or, when is_operator is true,
  // the operator.
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // is_operator selects operator-owned naming (namespace "fabric") instead of
  // org-owned naming (namespace "fabric-shard-{org}")
  bool is_operator = 2 [
    json_name = "IsOperator",
    (go.field).tags = 'json:"IsOperator,omitempty"'
  ];
}

message CreateServiceAccountOutput {}

// ==================== CreateDeployment Workflow Messages ====================

message CreateDeploymentInput {
  // org is the owner identifier: an organization (e.g., "org1") or, when
  // is_operator is true, the operator (e.g., "metacensus").
  // Used to derive namespace names, service account names, etc.
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // component specifies which type of deployment to create
  // Currently supported:
  //   - "worker": Fabric worker deployment (shared fabric worker when is_operator,
  //       otherwise a per-org shard worker)
  //   - "certificate-store": PostgreSQL certificate store
  //   - "certificate-authority-{certType}-{caID}": Certificate Authority
  //       where certType is "tls" or "org", and caID is "root" or "int".
  //       Examples: "certificate-authority-tls-root", "certificate-authority-org-int"
  //   - "couchdb-{peerId}", "peer{id}", "orderer{id}"
  string component = 2 [
    json_name = "Component",
    (go.field).tags = 'json:"Component" validate:"required"'
  ];

  // is_operator selects operator-owned naming (namespace "fabric") instead of
  // org-owned naming (namespace "fabric-shard-{org}")
  bool is_operator = 3 [
    json_name = "IsOperator",
    (go.field).tags = 'json:"IsOperator,omitempty"'
  ];
}

message CreateDeploymentOutput {
  // deployment_name is the name of the created deployment
  string deployment_name = 1 [
    json_name = "DeploymentName",
    (go.field).tags = 'json:"DeploymentName" validate:"required"'
  ];
}
