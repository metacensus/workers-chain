syntax = "proto3";

package secrets.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "nexus/v1/options.proto";
import "patch/go.proto";
import "temporal/v1/temporal.proto";
import "vault/v1/vault.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/secrets/v1;secretsv1";

// Secrets service provides unified secret management operations.
// Includes secret creation/storage, key generation, and access management.
// Nexus-enabled for cross-namespace calls (fabric workers calling CreateAccess on infra worker).
service Secrets {
  option (.nexus.v1.service).tags = "nexus-enabled";
  option (temporal.v1.service) = {task_queue: "infra"};

  // CreatePassword generates a secure password and stores it with the given username.
  rpc CreatePassword(CreatePasswordInput) returns (CreatePasswordOutput) {
    option (.nexus.v1.operation).tags = "activity"; // Exclude from Nexus
    option (temporal.v1.activity) = {
      name: "secrets.v1.CreatePassword"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // CreateKeyPair generates an ECDSA key pair (P-256) and stores it.
  rpc CreateKeyPair(CreateKeyPairInput) returns (CreateKeyPairOutput) {
    option (.nexus.v1.operation).tags = "activity"; // Exclude from Nexus
    option (temporal.v1.activity) = {
      name: "secrets.v1.CreateKeyPair"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // CreateSelfSignedCertificate fetches a key pair, generates a self-signed certificate, and stores it.
  // Used for root CA certificates only. Implemented as an activity to keep secrets out of workflow history.
  rpc CreateSelfSignedCertificate(CreateSelfSignedCertificateInput) returns (CreateSelfSignedCertificateOutput) {
    option (.nexus.v1.operation).tags = "activity"; // Exclude from Nexus
    option (temporal.v1.activity) = {
      name: "secrets.v1.CreateSelfSignedCertificate"
      schedule_to_close_timeout: {seconds: 300}
    };
  }

  // StoreCertificate stores certificate data at the specified location.
  // Implemented as an activity to keep certificate data out of workflow history.
  rpc StoreCertificate(StoreCertificateInput) returns (StoreCertificateOutput) {
    option (.nexus.v1.operation).tags = "activity"; // Exclude from Nexus
    option (temporal.v1.activity) = {
      name: "secrets.v1.StoreCertificate"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // CreateAccess creates a Vault policy and Kubernetes auth role for secret access.
  // Orchestrates CreatePolicy and CreateAuthRole vault activities.
  rpc CreateAccess(CreateAccessInput) returns (CreateAccessOutput) {
    option (temporal.v1.workflow) = {
      name: "secrets.v1.CreateAccess"
      id: 'secrets/create-access/${! PolicyName.or("default") }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // StoreGenesisBlock stores a channel genesis block in Vault for cross-org access
  rpc StoreGenesisBlock(StoreGenesisBlockInput) returns (StoreGenesisBlockOutput) {
    option (.nexus.v1.operation).tags = "activity"; // Exclude from Nexus
    option (temporal.v1.activity) = {
      name: "secrets.v1.StoreGenesisBlock"
      schedule_to_close_timeout: {seconds: 60}
    };
  }
}

// ==================== SecretRef ====================

// SecretRef is a backend-agnostic reference to a secret.
// The ref field is a structured object interpreted based on type.
// Examples:
//   - type: "vault", ref: {path: "fabric/org1/ca/tls/root/admin", version: 1}
//   - type: "k8s", ref: {namespace: "default", name: "my-secret", key: "password"}
message SecretRef {
  // type identifies the secret backend (e.g., "vault", "k8s")
  string type = 1 [
    json_name = "Type",
    (go.field).tags = 'json:"Type" validate:"required"'
  ];

  // ref is backend-specific structured reference data
  google.protobuf.Struct ref = 2 [
    json_name = "Ref",
    (go.field).tags = 'json:"Ref" validate:"required"'
  ];
}

// ==================== CreatePassword ====================

// CreatePasswordInput specifies where to store generated credentials
message CreatePasswordInput {
  // secret_ref is where credentials should be stored
  SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];

  // username to store alongside the generated password
  string username = 2 [
    json_name = "Username",
    (go.field).tags = 'json:"Username" validate:"required"'
  ];
}

// CreatePasswordOutput confirms credentials were stored
message CreatePasswordOutput {
  SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];
}

// ==================== CreateKeyPair ====================

// CreateKeyPairInput specifies where to store the generated key pair
message CreateKeyPairInput {
  // secret_ref is where the key pair should be stored
  SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];
}

// CreateKeyPairOutput confirms key pair was stored
message CreateKeyPairOutput {
  SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];
}

// ==================== CreateSelfSignedCertificate ====================

// CreateSelfSignedCertificateInput specifies key location, cert destination, and certificate parameters
message CreateSelfSignedCertificateInput {
  // key_ref is where to fetch the private key from
  SecretRef key_ref = 1 [
    json_name = "KeyRef",
    (go.field).tags = 'json:"KeyRef" validate:"required"'
  ];

  // cert_ref is where to store the generated certificate
  SecretRef cert_ref = 2 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];

  // common_name is the CN field in the certificate subject
  string common_name = 3 [
    json_name = "CommonName",
    (go.field).tags = 'json:"CommonName" validate:"required"'
  ];

  // organization is the O field in the certificate subject
  string organization = 4 [
    json_name = "Organization",
    (go.field).tags = 'json:"Organization" validate:"required"'
  ];

  // organizational_unit is the OU field in the certificate subject
  string organizational_unit = 5 [
    json_name = "OrganizationalUnit",
    (go.field).tags = 'json:"OrganizationalUnit"'
  ];

  // validity_duration is how long the certificate is valid
  google.protobuf.Duration validity_duration = 6 [
    json_name = "ValidityDuration",
    (go.field).tags = 'json:"ValidityDuration" validate:"required"'
  ];

  // max_path_length sets the pathLenConstraint in BasicConstraints
  int32 max_path_length = 7 [
    json_name = "MaxPathLength",
    (go.field).tags = 'json:"MaxPathLength" validate:"min=0"'
  ];

  // dns_names are Subject Alternative Names (SANs) for TLS server certificates
  // Required for TLS certificate validation - modern clients require SANs even if CN matches
  repeated string dns_names = 8 [
    json_name = "DnsNames",
    (go.field).tags = 'json:"DnsNames"'
  ];
}

// CreateSelfSignedCertificateOutput confirms certificate was stored
message CreateSelfSignedCertificateOutput {
  SecretRef cert_ref = 1 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];
}

// ==================== StoreCertificate ====================

// StoreCertificateInput specifies certificate data to store
message StoreCertificateInput {
  // cert_ref is where to store the certificate
  SecretRef cert_ref = 1 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];

  // certificate_pem is the PEM-encoded certificate to store
  bytes certificate_pem = 2 [
    json_name = "CertificatePem",
    (go.field).tags = 'json:"CertificatePem" validate:"required"'
  ];

  // ca_chain_pem is the optional PEM-encoded CA certificate chain
  bytes ca_chain_pem = 3 [
    json_name = "CaChainPem",
    (go.field).tags = 'json:"CaChainPem"'
  ];
}

// StoreCertificateOutput confirms certificate was stored
message StoreCertificateOutput {
  SecretRef cert_ref = 1 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];
}

// ==================== CreateAccess ====================

// CreateAccessInput specifies parameters for creating secret access (policy + auth role)
message CreateAccessInput {
  // policy_name is the name of the policy to create
  string policy_name = 1 [
    json_name = "PolicyName",
    (go.field).tags = 'json:"PolicyName" validate:"required"'
  ];

  // policy_document contains the structured policy rules
  vault.v1.PolicyDocument policy_document = 2 [
    json_name = "PolicyDocument",
    (go.field).tags = 'json:"PolicyDocument" validate:"required"'
  ];

  // auth_role_name is the name of the auth role to create
  string auth_role_name = 3 [
    json_name = "AuthRoleName",
    (go.field).tags = 'json:"AuthRoleName" validate:"required"'
  ];

  // service_account_name is the Kubernetes service account that can authenticate
  string service_account_name = 4 [
    json_name = "ServiceAccountName",
    (go.field).tags = 'json:"ServiceAccountName" validate:"required"'
  ];

  // kubernetes_namespace is where the service account exists
  string kubernetes_namespace = 5 [
    json_name = "KubernetesNamespace",
    (go.field).tags = 'json:"KubernetesNamespace" validate:"required"'
  ];
}

// CreateAccessOutput confirms access was created
message CreateAccessOutput {
  string policy_name = 1 [
    json_name = "PolicyName",
    (go.field).tags = 'json:"PolicyName" validate:"required"'
  ];

  string auth_role_name = 2 [
    json_name = "AuthRoleName",
    (go.field).tags = 'json:"AuthRoleName" validate:"required"'
  ];
}

// ==================== StoreGenesisBlock Activity Messages ====================

message StoreGenesisBlockInput {}

message StoreGenesisBlockOutput {}
