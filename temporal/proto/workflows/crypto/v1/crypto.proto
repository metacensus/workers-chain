syntax = "proto3";

package crypto.v1;

import "patch/go.proto";
import "temporal/v1/temporal.proto";
import "vault/v1/vault.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/crypto/v1;cryptov1";

// Crypto service defines activities for cryptographic operations
// Activities generate passwords, key pairs, and other cryptographic primitives
service Crypto {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // GeneratePassword generates a secure random password
  // Password is 32-character base64-URL-encoded random string
  rpc GeneratePassword(GeneratePasswordInput) returns (GeneratePasswordOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "crypto.v1.GeneratePassword"
      schedule_to_close_timeout: {seconds: 30}
    };
  }

  // GenerateKeyPair generates an ECDSA key pair
  // Key is 256-bit ECDSA (P-256 curve)
  rpc GenerateKeyPair(GenerateKeyPairInput) returns (GenerateKeyPairOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "crypto.v1.GenerateKeyPair"
      schedule_to_close_timeout: {seconds: 30}
    };
  }

  // GenerateAndStorePassword generates a password and stores it in Vault
  // Orchestrates GeneratePassword activity + vault.v1.StoreSecret activity
  // Username and password are stored with key names "username" and "password"
  rpc GenerateAndStorePassword(GenerateAndStorePasswordInput) returns (GenerateAndStorePasswordOutput) {
    option (temporal.v1.workflow) = {
      name: "crypto.v1.GenerateAndStorePassword"
      id: 'crypto/generate-store-password/${! VaultPath.or("default") }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // GenerateAndStoreKeyPair generates a key pair and stores it in Vault
  // Orchestrates GenerateKeyPair activity + vault.v1.StoreSecret activity
  // Keys are stored with names "private" and "public" at the same VaultPath
  rpc GenerateAndStoreKeyPair(GenerateAndStoreKeyPairInput) returns (GenerateAndStoreKeyPairOutput) {
    option (temporal.v1.workflow) = {
      name: "crypto.v1.GenerateAndStoreKeyPair"
      id: 'crypto/generate-store-keypair/${! VaultPath.or("default") }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }
}

// ==================== Password Generation ====================

// GeneratePasswordInput specifies password generation parameters
message GeneratePasswordInput {
  // Currently no parameters needed - uses fixed 32-character base64-URL-encoded output
}

// GeneratePasswordOutput contains the generated password
message GeneratePasswordOutput {
  // password is the generated secure random password
  string password = 1 [
    json_name = "Password",
    (go.field).tags = 'json:"Password" validate:"required"'
  ];
}

// ==================== Key Pair Generation ====================

// GenerateKeyPairInput specifies key pair generation parameters
message GenerateKeyPairInput {
  // Currently no parameters needed - uses fixed 256-bit ECDSA (P-256 curve)
}

// GenerateKeyPairOutput contains the generated key pair
message GenerateKeyPairOutput {
  // private_key is the PEM-encoded private key
  bytes private_key = 1 [
    json_name = "PrivateKey",
    (go.field).tags = 'json:"PrivateKey" validate:"required"'
  ];

  // public_key is the PEM-encoded public key
  bytes public_key = 2 [
    json_name = "PublicKey",
    (go.field).tags = 'json:"PublicKey" validate:"required"'
  ];
}

// ==================== Workflows ====================

// GenerateAndStorePasswordInput specifies where to store the generated password
message GenerateAndStorePasswordInput {
  // vault_path is the Vault path to store the password at
  // Example: "fabric/org1/ca/tls/root/admin"
  string vault_path = 1 [
    json_name = "VaultPath",
    (go.field).tags = 'json:"VaultPath" validate:"required"'
  ];

  // username is the username to store alongside the password
  // Example: "postgres_ca_tls_root"
  string username = 2 [
    json_name = "Username",
    (go.field).tags = 'json:"Username" validate:"required"'
  ];
}

// GenerateAndStorePasswordOutput returns the Vault secret reference
message GenerateAndStorePasswordOutput {
  // secret_ref is the Vault secret reference with path and version
  vault.v1.SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];
}

// GenerateAndStoreKeyPairInput specifies where to store the generated key pair
message GenerateAndStoreKeyPairInput {
  // vault_path is the Vault path to store the key pair at
  // Both keys (private and public) are stored at this path
  // Example: "fabric/org1/ca/tls/root/keys"
  string vault_path = 1 [
    json_name = "VaultPath",
    (go.field).tags = 'json:"VaultPath" validate:"required"'
  ];
}

// GenerateAndStoreKeyPairOutput returns the Vault secret reference
message GenerateAndStoreKeyPairOutput {
  // secret_ref is the Vault secret reference with path and version
  vault.v1.SecretRef secret_ref = 1 [
    json_name = "SecretRef",
    (go.field).tags = 'json:"SecretRef" validate:"required"'
  ];
}
