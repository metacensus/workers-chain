syntax = "proto3";

package crypto.v1;

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/crypto/v1;cryptov1";

import "temporal/v1/temporal.proto";

// Crypto service defines activities for cryptographic operations
// Activities generate passwords, key pairs, and other cryptographic primitives
service Crypto {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {
    task_queue: "infra"
  };

  // GeneratePassword generates a secure random password
  // Password is 32-character base64-URL-encoded random string
  rpc GeneratePassword(GeneratePasswordInput) returns (GeneratePasswordOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "crypto.v1.GeneratePassword"
      schedule_to_close_timeout: {seconds: 30}
    };
  }

  // GenerateKeyPair generates an ECDSA key pair
  // Key is 256-bit ECDSA (P-256 curve)
  rpc GenerateKeyPair(GenerateKeyPairInput) returns (GenerateKeyPairOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "crypto.v1.GenerateKeyPair"
      schedule_to_close_timeout: {seconds: 30}
    };
  }
}

// ==================== Password Generation ====================

// GeneratePasswordInput specifies password generation parameters
message GeneratePasswordInput {
  // Currently no parameters needed - uses fixed 32-character base64-URL-encoded output
}

// GeneratePasswordOutput contains the generated password
message GeneratePasswordOutput {
  // password is the generated secure random password
  string password = 1;
}

// ==================== Key Pair Generation ====================

// GenerateKeyPairInput specifies key pair generation parameters
message GenerateKeyPairInput {
  // Currently no parameters needed - uses fixed 256-bit ECDSA (P-256 curve)
}

// GenerateKeyPairOutput contains the generated key pair
message GenerateKeyPairOutput {
  // private_key is the PEM-encoded private key
  bytes private_key = 1;
  
  // public_key is the PEM-encoded public key
  bytes public_key = 2;
}

