syntax = "proto3";

package fabric.v1;

import "nexus/v1/options.proto";
import "patch/go.proto";
import "temporal/v1/temporal.proto";
import "secrets/v1/secrets.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/fabric/v1;fabricv1";

// Fabric service defines workflows for manipulating a Fabric shard
// These workflows run on the fabric worker in the org-specific Temporal namespace
service Fabric {
  // Enable Nexus for cross-namespace calls from central worker
  option (.nexus.v1.service).tags = "nexus-enabled";
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // BootstrapShard is the entry point for Phase 2 of shard initialization
  // This workflow runs on the fabric worker in the org's Temporal namespace (e.g., "fabric-org1")
  // and deploys all Fabric components (CAs, peers, orderers) for the organization.
  // Called via Nexus from the central worker after Phase 1 completes
  rpc BootstrapShard(BootstrapShardInput) returns (BootstrapShardOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.BootstrapShard"
      id: 'fabric/bootstrap-shard'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // BootstrapCertificateAuthorities orchestrates the deployment of all certificate authorities
  // for a Fabric organization. This includes the certificate store, root CA, and intermediate CAs.
  rpc BootstrapCertificateAuthorities(BootstrapCertificateAuthoritiesInput) returns (BootstrapCertificateAuthoritiesOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.BootstrapCertificateAuthorities"
      id: 'fabric/bootstrap-certificate-authorities'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployCertificateStore deploys the shared certificate store (PostgreSQL)
  // used by all certificate authorities in the organization.
  rpc DeployCertificateStore(DeployCertificateStoreInput) returns (DeployCertificateStoreOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployCertificateStore"
      id: 'fabric/deploy-certificate-store'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployRootCertificateAuthority deploys the root certificate authority (root CA)
  // for the Fabric organization. The root CA is the top-level CA in the PKI hierarchy
  // and is used to issue intermediate CAs for org and TLS identities.
  rpc DeployRootCertificateAuthority(DeployRootCertificateAuthorityInput) returns (DeployRootCertificateAuthorityOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployRootCertificateAuthority"
      // Workflow ID includes CertType and root suffix for clarity
      id: 'fabric/deploy-certificate-authority/${! CertType }/root'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployCertificateAuthority deploys an intermediate certificate authority (intermediate CA)
  // for the Fabric organization. Intermediate CAs are deployed for both "org" and "tls" purposes.
  rpc DeployCertificateAuthority(DeployCertificateAuthorityInput) returns (DeployCertificateAuthorityOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployCertificateAuthority"
      // Workflow ID includes CertType and Id to allow parallel deployment and rotation
      id: 'fabric/deploy-certificate-authority/${! CertType }/${! Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateCertificateDatabase creates a dedicated database and user for a certificate authority
  // in the shared certificate store (PostgreSQL). Each CA (root and intermediate) gets its own
  // isolated database to store issued certificates and revocation information.
  rpc CreateCertificateDatabase(CreateCertificateDatabaseInput) returns (CreateCertificateDatabaseOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateCertificateDatabase"
      id: 'fabric/create-certificate-database/${! CertType }/${! CertificateAuthorityId }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // BootstrapCertificateAuthorityAdmin bootstraps the admin user for a certificate authority
  // After a CA is deployed, this workflow creates admin identities for both tls and org,
  // then revokes the bootstrap admin credentials
  rpc BootstrapCertificateAuthorityAdmin(BootstrapCertificateAuthorityAdminInput) returns (BootstrapCertificateAuthorityAdminOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.BootstrapCertificateAuthorityAdmin"
      id: 'fabric/bootstrap-certificate-authority-admin/${! CertType }/${! CertificateAuthorityId }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateIdentity creates a new Fabric identity by generating keys, registering with CA, and enrolling
  // Used for creating admin identities, peer identities, orderer identities, and chaincode identities
  rpc CreateIdentity(CreateIdentityInput) returns (CreateIdentityOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateIdentity"
      id: 'fabric/create-identity/${! CertType }/${! IdentityName }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }
}

// FabricActivities service defines activities for Fabric CA operations
// These activities interact with Fabric CA for identity management
// Activities are NOT exposed via Nexus (only workflows can be called cross-namespace)
service FabricActivities {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // RegisterIdentity registers a new identity with a Fabric CA
  // This is the first step in identity creation - registration returns an enrollment secret
  rpc RegisterIdentity(RegisterIdentityInput) returns (RegisterIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.RegisterIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // EnrollIdentity enrolls a registered identity and retrieves certificates
  // This is the second step in identity creation - enrollment uses the secret from registration
  rpc EnrollIdentity(EnrollIdentityInput) returns (EnrollIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.EnrollIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // RevokeIdentity revokes an identity from a Fabric CA
  // Used to revoke bootstrap admin credentials after permanent admin is created
  rpc RevokeIdentity(RevokeIdentityInput) returns (RevokeIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.RevokeIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // BootstrapEnrollIdentity enrolls an identity using bootstrap credentials (username/password)
  // This is used ONLY during CA initialization to obtain the bootstrap admin's certificate
  // The activity generates a CSR internally and submits it to the CA
  rpc BootstrapEnrollIdentity(BootstrapEnrollIdentityInput) returns (BootstrapEnrollIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.BootstrapEnrollIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }
}

// ==================== BootstrapShard Workflow Messages ====================

// BootstrapShardInput specifies the parameters for bootstrapping a Fabric shard
// Empty for now - will be populated as implementation progresses
message BootstrapShardInput {
  // Empty for now - org is implicit from the worker's namespace
}

// BootstrapShardOutput indicates the result of shard bootstrapping
// Empty for now - will be populated as implementation progresses
message BootstrapShardOutput {
  // Empty for now
}

// ==================== BootstrapCertificateAuthorities Workflow Messages ====================

// BootstrapCertificateAuthoritiesInput specifies the parameters for bootstrapping certificate authorities
// Empty for now - org is implicit from the worker's namespace
message BootstrapCertificateAuthoritiesInput {
  // Empty for now
}

// BootstrapCertificateAuthoritiesOutput indicates the result of CA bootstrapping
// Empty for now - will be populated as implementation progresses
message BootstrapCertificateAuthoritiesOutput {
  // Empty for now
}

// ==================== DeployCertificateStore Workflow Messages ====================

// DeployCertificateStoreInput specifies the parameters for deploying the certificate store
// Empty for now - org is implicit from the worker's namespace
message DeployCertificateStoreInput {
  // Empty for now
}

// DeployCertificateStoreOutput indicates the result of certificate store deployment
// Empty for now - will be populated as implementation progresses
message DeployCertificateStoreOutput {
  // Empty for now
}

// ==================== DeployRootCertificateAuthority Workflow Messages ====================

// DeployRootCertificateAuthorityInput specifies the parameters for deploying the root CA
message DeployRootCertificateAuthorityInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" (for secure communication), "org" (for Fabric MSP identity)
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];
}

// DeployRootCertificateAuthorityOutput indicates the result of root CA deployment
// Empty for now - will be populated as implementation progresses
message DeployRootCertificateAuthorityOutput {
  // Empty for now
}

// ==================== DeployCertificateAuthority Workflow Messages ====================

// DeployCertificateAuthorityInput specifies the parameters for deploying an intermediate CA
message DeployCertificateAuthorityInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // id is a unique identifier for this intermediate CA instance.
  // This enables rotation by deploying a new intermediate CA with a different ID
  // while the old one is still active, then switching over and revoking the old one.
  string id = 2 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];
}

// DeployCertificateAuthorityOutput indicates the result of intermediate CA deployment
// Empty for now - will be populated as implementation progresses
message DeployCertificateAuthorityOutput {
  // Empty for now
}

// ==================== CreateCertificateDatabase Workflow Messages ====================

// CreateCertificateDatabaseInput specifies the parameters for creating a certificate database
message CreateCertificateDatabaseInput {
  // cert_type specifies whether this is for a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA this database is for
  // Use "root" for root CAs, or a version ID (e.g., "v1", "v2") for intermediate CAs
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];
}

// CreateCertificateDatabaseOutput indicates the result of certificate database creation
message CreateCertificateDatabaseOutput {
  // credentials_ref is the Vault reference to retrieve the username and password
  // The database name can be derived from cert_type and certificate_authority_id using fabric config
  secrets.v1.SecretRef credentials_ref = 1 [
    json_name = "CredentialsRef",
    (go.field).tags = 'json:"CredentialsRef" validate:"required"'
  ];
}

// ==================== BootstrapCertificateAuthorityAdmin Workflow Messages ====================

// BootstrapCertificateAuthorityAdminInput specifies the parameters for bootstrapping CA admin
message BootstrapCertificateAuthorityAdminInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA to bootstrap the admin for
  // Use "root" for root CAs, or a version ID (e.g., "v1", "v2") for intermediate CAs
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];

  // bootstrap_credentials_ref points to the bootstrap admin username/password in Vault
  secrets.v1.SecretRef bootstrap_credentials_ref = 3 [
    json_name = "BootstrapCredentialsRef",
    (go.field).tags = 'json:"BootstrapCredentialsRef" validate:"required"'
  ];
}

// BootstrapCertificateAuthorityAdminOutput indicates the result of CA admin bootstrap
// Empty for now - will be populated as implementation progresses
message BootstrapCertificateAuthorityAdminOutput {
  // Empty for now
}

// ==================== CreateIdentity Workflow Messages ====================

// CreateIdentityInput specifies the parameters for creating a Fabric identity
message CreateIdentityInput {
  // cert_type specifies whether this is a TLS or Org identity
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA to use for identity creation
  // Use "root" for root CAs, or a version ID (e.g., "v1", "v2") for intermediate CAs
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];

  // identity_name is the unique name for this identity (e.g., "admin", "peer0", "orderer0")
  string identity_name = 3 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // common_name is the CN for the certificate subject
  string common_name = 4 [
    json_name = "CommonName",
    (go.field).tags = 'json:"CommonName" validate:"required"'
  ];

  // organization is the O for the certificate subject
  string organization = 5 [
    json_name = "Organization",
    (go.field).tags = 'json:"Organization" validate:"required"'
  ];

  // organizational_unit is the OU for the certificate subject
  string organizational_unit = 6 [
    json_name = "OrganizationalUnit",
    (go.field).tags = 'json:"OrganizationalUnit" validate:"required"'
  ];

  // affiliation is the affiliation for the identity in the CA
  string affiliation = 7 [
    json_name = "Affiliation",
    (go.field).tags = 'json:"Affiliation"'
  ];

  // attributes are additional attributes for the identity
  map<string, string> attributes = 8 [
    json_name = "Attributes"
  ];

  // admin_credentials_ref specifies which admin credentials to use for registration
  // If not provided, uses the permanent admin credentials at VaultAdminKeyPairPath()
  // During bootstrap, this should point to VaultBootstrapAdminKeyPairPath()
  secrets.v1.SecretRef admin_credentials_ref = 9 [
    json_name = "AdminCredentialsRef"
  ];

  // storage_ref specifies where to store the identity credentials (keypair + certificate).
  // If not provided, uses auto-generated path: {ca_vault_base_path}/{identity_name}
  // Use this when the identity is being created by one CA but for another CA.
  // Example: Intermediate CA certificate signed by root CA should be stored at
  // intermediate CA's VaultServerRef, not at root CA's path.
  secrets.v1.SecretRef storage_ref = 10 [
    json_name = "StorageRef"
  ];

  // profile specifies which CA signing profile to use for the certificate.
  // Use "ca" for intermediate CA certificates (grants cert sign, crl sign key usages).
  // Leave empty to use the default profile (digital signature only).
  string profile = 11 [
    json_name = "Profile",
    (go.field).tags = 'json:"Profile,omitempty"'
  ];
}

// CreateIdentityOutput indicates the result of identity creation
message CreateIdentityOutput {
  // credentials_ref points to the identity credentials in Vault
  // Contains private_key, public_key, and certificate
  secrets.v1.SecretRef credentials_ref = 1 [
    json_name = "CredentialsRef",
    (go.field).tags = 'json:"CredentialsRef" validate:"required"'
  ];
}

// ==================== RegisterIdentity Activity Messages ====================

// RegisterIdentityInput specifies the parameters for registering an identity with a CA
message RegisterIdentityInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA to register with
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];

  // identity_name is the unique name for this identity
  string identity_name = 3 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // affiliation is the affiliation for the identity in the CA
  string affiliation = 4 [
    json_name = "Affiliation"
  ];

  // attributes are additional attributes for the identity
  map<string, string> attributes = 5 [
    json_name = "Attributes"
  ];

  // identity_type specifies the type of identity (e.g., "admin", "peer", "orderer", "client")
  string identity_type = 6 [
    json_name = "IdentityType",
    (go.field).tags = 'json:"IdentityType"'
  ];

  // admin_credentials_ref specifies which admin credentials to use for registration
  // If not provided, uses the permanent admin credentials at VaultAdminKeyPairPath()
  secrets.v1.SecretRef admin_credentials_ref = 7 [
    json_name = "AdminCredentialsRef"
  ];
}

// RegisterIdentityOutput contains the enrollment secret returned by the CA
message RegisterIdentityOutput {
  // enrollment_secret is the secret used to enroll the identity
  // This secret should be kept secure and used only for enrollment
  string enrollment_secret = 1 [
    json_name = "EnrollmentSecret",
    (go.field).tags = 'json:"EnrollmentSecret" validate:"required"'
  ];
}

// ==================== EnrollIdentity Activity Messages ====================

// EnrollIdentityInput specifies the parameters for enrolling an identity with a CA
message EnrollIdentityInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA to enroll with
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];

  // identity_name is the name of the identity to enroll
  string identity_name = 3 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // enrollment_secret is the secret obtained from registration
  string enrollment_secret = 4 [
    json_name = "EnrollmentSecret",
    (go.field).tags = 'json:"EnrollmentSecret" validate:"required"'
  ];

  // key_ref points to the private key to use for CSR generation
  secrets.v1.SecretRef key_ref = 5 [
    json_name = "KeyRef",
    (go.field).tags = 'json:"KeyRef" validate:"required"'
  ];

  // common_name is the CN for the certificate subject
  string common_name = 6 [
    json_name = "CommonName",
    (go.field).tags = 'json:"CommonName" validate:"required"'
  ];

  // organization is the O for the certificate subject
  string organization = 7 [
    json_name = "Organization",
    (go.field).tags = 'json:"Organization" validate:"required"'
  ];

  // organizational_unit is the OU for the certificate subject
  string organizational_unit = 8 [
    json_name = "OrganizationalUnit",
    (go.field).tags = 'json:"OrganizationalUnit" validate:"required"'
  ];

  // ca_tls_cert_ref points to the CA's TLS certificate in Vault
  secrets.v1.SecretRef ca_tls_cert_ref = 9 [
    json_name = "CaTlsCertRef",
    (go.field).tags = 'json:"CaTlsCertRef" validate:"required"'
  ];

  // profile specifies which CA signing profile to use for the certificate.
  // Use "ca" for intermediate CA certificates (grants cert sign, crl sign key usages).
  // Leave empty to use the default profile (digital signature only).
  string profile = 10 [
    json_name = "Profile",
    (go.field).tags = 'json:"Profile,omitempty"'
  ];
}

// EnrollIdentityOutput contains the certificates returned by the CA
message EnrollIdentityOutput {
  // cert_ref points to where the certificate was stored
  secrets.v1.SecretRef cert_ref = 1 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];
}

// ==================== RevokeIdentity Activity Messages ====================

// RevokeIdentityInput specifies the parameters for revoking an identity from a CA
message RevokeIdentityInput {
  // cert_type specifies whether this is a TLS or Org certificate authority
  // Valid values: "tls" or "org"
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required"'
  ];

  // certificate_authority_id identifies which CA to revoke from
  string certificate_authority_id = 2 [
    json_name = "CertificateAuthorityId",
    (go.field).tags = 'json:"CertificateAuthorityId" validate:"required"'
  ];

  // identity_name is the name of the identity to revoke
  string identity_name = 3 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // reason is the reason for revocation (optional)
  string reason = 4 [
    json_name = "Reason"
  ];

  // admin_credentials_ref specifies which admin credentials to use for revocation
  // If not provided, uses the permanent admin credentials at VaultAdminKeyPairPath()
  secrets.v1.SecretRef admin_credentials_ref = 5 [
    json_name = "AdminCredentialsRef"
  ];
}

// RevokeIdentityOutput indicates the result of identity revocation
message RevokeIdentityOutput {
  // revoked indicates if the identity was successfully revoked
  bool revoked = 1 [
    json_name = "Revoked"
  ];
}

// ==================== BootstrapEnrollIdentity Activity Messages ====================

// BootstrapEnrollIdentityInput specifies the parameters for bootstrap enrollment
message BootstrapEnrollIdentityInput {
  // ca_url is the CA server URL (e.g., "https://ca-tls-root.fabric-org1.svc.cluster.local:7054")
  string ca_url = 1 [
    json_name = "CaUrl",
    (go.field).tags = 'json:"CaUrl" validate:"required,url"'
  ];

  // bootstrap_credentials_ref points to the bootstrap admin username/password in Vault
  secrets.v1.SecretRef bootstrap_credentials_ref = 2 [
    json_name = "BootstrapCredentialsRef",
    (go.field).tags = 'json:"BootstrapCredentialsRef" validate:"required"'
  ];

  // key_ref points to the private key in Vault to use for CSR generation
  secrets.v1.SecretRef key_ref = 3 [
    json_name = "KeyRef",
    (go.field).tags = 'json:"KeyRef" validate:"required"'
  ];

  // cert_ref is where to store the enrolled certificate
  secrets.v1.SecretRef cert_ref = 4 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];

  // common_name is the CN for the certificate subject
  string common_name = 5 [
    json_name = "CommonName",
    (go.field).tags = 'json:"CommonName" validate:"required"'
  ];

  // organization is the O for the certificate subject
  string organization = 6 [
    json_name = "Organization",
    (go.field).tags = 'json:"Organization" validate:"required"'
  ];

  // organizational_unit is the OU for the certificate subject
  string organizational_unit = 7 [
    json_name = "OrganizationalUnit",
    (go.field).tags = 'json:"OrganizationalUnit" validate:"required"'
  ];

  // ca_tls_cert_ref points to the CA's TLS certificate in Vault
  // This certificate is used to verify the CA server's TLS connection
  secrets.v1.SecretRef ca_tls_cert_ref = 8 [
    json_name = "CaTlsCertRef",
    (go.field).tags = 'json:"CaTlsCertRef" validate:"required"'
  ];
}

// BootstrapEnrollIdentityOutput confirms the certificate was enrolled and stored
message BootstrapEnrollIdentityOutput {
  // cert_ref is where the certificate was stored
  secrets.v1.SecretRef cert_ref = 1 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];
}
