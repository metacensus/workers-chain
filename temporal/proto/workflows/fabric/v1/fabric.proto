syntax = "proto3";

package fabric.v1;

import "google/protobuf/duration.proto";
import "nexus/v1/options.proto";
import "patch/go.proto";
import "secrets/v1/secrets.proto";
import "temporal/v1/temporal.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/fabric/v1;fabricv1";

// ==================== Deployment Configuration Messages ====================

// OrgFabricDeployment represents the complete fabric deployment configuration
// Passed as required input to BootstrapShard - no defaults, caller must specify all components
message OrgFabricDeployment {
  // certificate_authorities specifies the CAs to deploy (in order)
  // Order matters: TLS chain must be deployed before Org chain
  repeated CertificateAuthoritySpec certificate_authorities = 1 [
    json_name = "CertificateAuthorities",
    (go.field).tags = 'json:"CertificateAuthorities" validate:"required,min=1"'
  ];

  // peers specifies the peers to deploy
  repeated PeerSpec peers = 2 [
    json_name = "Peers",
    (go.field).tags = 'json:"Peers" validate:"required,min=1"'
  ];

  // orderers specifies the orderers to deploy
  repeated OrdererSpec orderers = 3 [
    json_name = "Orderers",
    (go.field).tags = 'json:"Orderers" validate:"required,min=1"'
  ];
}

// CertificateAuthoritySpec defines a certificate authority to deploy
message CertificateAuthoritySpec {
  // self identifies this CA
  CertificateAuthorityRef self = 1 [
    json_name = "Self",
    (go.field).tags = 'json:"Self" validate:"required"'
  ];

  // signing_issuer identifies who issues this CA's signing certificate
  // If nil/empty, the signing cert is self-signed (root CAs)
  CertificateAuthorityRef signing_issuer = 2 [
    json_name = "SigningIssuer",
    (go.field).tags = 'json:"SigningIssuer,omitempty"'
  ];

  // tls_issuer identifies who issues this CA's TLS certificate
  // If nil/empty, the TLS cert is self-signed (TLS Root CA only)
  CertificateAuthorityRef tls_issuer = 3 [
    json_name = "TlsIssuer",
    (go.field).tags = 'json:"TlsIssuer,omitempty"'
  ];

  // validity_duration specifies how long the CA certificates are valid
  google.protobuf.Duration validity_duration = 4 [
    json_name = "ValidityDuration",
    (go.field).tags = 'json:"ValidityDuration,omitempty"'
  ];
}

// PeerSpec defines a peer to deploy
message PeerSpec {
  // id identifies this peer (e.g., "peer0", "peer1")
  string id = 1 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];

  // org_issuer identifies which CA issues the peer's identity certificate
  CertificateAuthorityRef org_issuer = 2 [
    json_name = "OrgIssuer",
    (go.field).tags = 'json:"OrgIssuer" validate:"required"'
  ];

  // tls_issuer identifies which CA issues the peer's TLS certificate
  CertificateAuthorityRef tls_issuer = 3 [
    json_name = "TlsIssuer",
    (go.field).tags = 'json:"TlsIssuer" validate:"required"'
  ];
}

// OrdererSpec defines an orderer to deploy
message OrdererSpec {
  // id identifies this orderer (e.g., "orderer0", "orderer1")
  string id = 1 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];

  // org_issuer identifies which CA issues the orderer's identity certificate
  CertificateAuthorityRef org_issuer = 2 [
    json_name = "OrgIssuer",
    (go.field).tags = 'json:"OrgIssuer" validate:"required"'
  ];

  // tls_issuer identifies which CA issues the orderer's TLS certificate
  CertificateAuthorityRef tls_issuer = 3 [
    json_name = "TlsIssuer",
    (go.field).tags = 'json:"TlsIssuer" validate:"required"'
  ];
}

// ==================== Reusable Messages ====================

// CertificateAuthorityRef identifies a specific Certificate Authority
// Used to specify issuers and targets for certificate operations
message CertificateAuthorityRef {
  // cert_type specifies the CA chain ("tls" or "org")
  string cert_type = 1 [
    json_name = "CertType",
    (go.field).tags = 'json:"CertType" validate:"required,oneof=tls org"'
  ];

  // id identifies the CA within its chain ("root" or version like "v1")
  string id = 2 [
    json_name = "Id",
    (go.field).tags = 'json:"Id" validate:"required"'
  ];
}

// IdentityRef represents a complete identity (private key + certificate pair).
// Per cert-design.md, keys and certs are stored at separate Vault paths:
//   - keys/... contains {private_key, public_key}
//   - certs/... contains {certificate, chain}
// This message groups the two refs that together form a complete identity.
message IdentityRef {
  // key_ref points to the private key (keys/ path)
  secrets.v1.SecretRef key_ref = 1 [
    json_name = "KeyRef",
    (go.field).tags = 'json:"KeyRef" validate:"required"'
  ];

  // cert_ref points to the certificate (certs/ path)
  secrets.v1.SecretRef cert_ref = 2 [
    json_name = "CertRef",
    (go.field).tags = 'json:"CertRef" validate:"required"'
  ];
}

// CertificateSubject defines the subject fields for a certificate
message CertificateSubject {
  // common_name is the CN for the certificate subject
  string common_name = 1 [
    json_name = "CommonName",
    (go.field).tags = 'json:"CommonName" validate:"required"'
  ];

  // organization is the O for the certificate subject
  string organization = 2 [
    json_name = "Organization",
    (go.field).tags = 'json:"Organization"'
  ];

  // organizational_unit is the OU for the certificate subject
  string organizational_unit = 3 [
    json_name = "OrganizationalUnit",
    (go.field).tags = 'json:"OrganizationalUnit"'
  ];

  // dns_names are Subject Alternative Names for TLS certificates
  repeated string dns_names = 4 [
    json_name = "DnsNames",
    (go.field).tags = 'json:"DnsNames,omitempty"'
  ];
}

// ==================== Service Definitions ====================

// Fabric service defines workflows for manipulating a Fabric shard
// These workflows run on the fabric worker in the org-specific Temporal namespace
service Fabric {
  // Enable Nexus for cross-namespace calls from central worker
  option (.nexus.v1.service).tags = "nexus-enabled";
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // BootstrapShard is the entry point for Phase 2 of shard initialization
  // This workflow runs on the fabric worker in the org's Temporal namespace (e.g., "fabric-org1")
  // and deploys all Fabric components (CAs, peers, orderers) for the organization.
  // Called via Nexus from the central worker after Phase 1 completes
  rpc BootstrapShard(BootstrapShardInput) returns (BootstrapShardOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.BootstrapShard"
      id: 'fabric/bootstrap-shard'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // BootstrapCertificateAuthorities deploys the certificate store and TLS CA chain
  // This workflow is used by operator-level infrastructure to set up shared TLS CAs
  // It validates that only TLS CAs are specified in the input
  rpc BootstrapCertificateAuthorities(BootstrapCertificateAuthoritiesInput) returns (BootstrapCertificateAuthoritiesOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.BootstrapCertificateAuthorities"
      id: 'fabric/bootstrap-certificate-authorities'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployCertificateStore deploys the shared certificate store (PostgreSQL)
  // used by all certificate authorities in the organization.
  rpc DeployCertificateStore(DeployCertificateStoreInput) returns (DeployCertificateStoreOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployCertificateStore"
      id: 'fabric/deploy-certificate-store'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployCertificateAuthority deploys a certificate authority (root or intermediate)
  // This unified workflow handles both root and intermediate CAs:
  // - Root CAs: self-signed signing cert, TLS from self (TLS Root) or TLS Int (Org Root)
  // - Int CAs: parent-signed signing cert, TLS from parent (TLS) or TLS Int (Org)
  rpc DeployCertificateAuthority(DeployCertificateAuthorityInput) returns (DeployCertificateAuthorityOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployCertificateAuthority"
      id: 'fabric/deploy-certificate-authority/${! Spec.Self.CertType }/${! Spec.Self.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateCertificateDatabase creates a dedicated database and user for a certificate authority
  // in the shared certificate store (PostgreSQL). Each CA (root and intermediate) gets its own
  // isolated database to store issued certificates and revocation information.
  rpc CreateCertificateDatabase(CreateCertificateDatabaseInput) returns (CreateCertificateDatabaseOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateCertificateDatabase"
      id: 'fabric/create-certificate-database/${! CaRef.CertType }/${! CaRef.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateCertificate creates a certificate issued by a CA (or self-signed if no issuer)
  // This is the atomic unit of certificate issuance - generates keypair, registers, enrolls.
  // Used for CA signing certs, TLS certs, and any other certificate needs.
  rpc CreateCertificate(CreateCertificateInput) returns (CreateCertificateOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateCertificate"
      id: 'fabric/create-certificate/${! Purpose }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateBootstrapAdmin creates the bootstrap admin identity for a CA
  // This is called after CA deployment to enroll using bootstrap credentials.
  // Creates both signing and TLS client certs for the bootstrap admin.
  rpc CreateBootstrapAdmin(CreateBootstrapAdminInput) returns (CreateBootstrapAdminOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateBootstrapAdmin"
      id: 'fabric/create-bootstrap-admin/${! CaRef.CertType }/${! CaRef.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateAdmin creates the permanent admin identity for a CA
  // Uses the bootstrap admin to register/enroll a new permanent admin.
  // Creates both signing and TLS client certs for the permanent admin.
  rpc CreateAdmin(CreateAdminInput) returns (CreateAdminOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateAdmin"
      id: 'fabric/create-admin/${! CaRef.CertType }/${! CaRef.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // CreateIdentity creates a full Fabric identity with both org and TLS certificates
  // Used for creating peer, orderer, admin, and client identities.
  // This is the production workflow for identity creation (not bootstrap).
  rpc CreateIdentity(CreateIdentityInput) returns (CreateIdentityOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.CreateIdentity"
      id: 'fabric/create-identity/${! IdentityName }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployCouchDb deploys a CouchDB instance for a peer
  // CouchDB provides rich query support for Fabric state database
  rpc DeployCouchDb(DeployCouchDbInput) returns (DeployCouchDbOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployCouchDb"
      id: 'fabric/deploy-couchdb/${! PeerId }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployPeer deploys a Fabric peer node
  // Peers endorse transactions and maintain ledger state
  rpc DeployPeer(DeployPeerInput) returns (DeployPeerOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployPeer"
      id: 'fabric/deploy-peer/${! Spec.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployOrderer deploys a Fabric orderer node
  // Orderers provide consensus and block ordering services
  rpc DeployOrderer(DeployOrdererInput) returns (DeployOrdererOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployOrderer"
      id: 'fabric/deploy-orderer/${! Spec.Id }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }

  // DeployChainCode deploys a chaincode (smart contract) to the Fabric network
  // Chaincode runs in isolated containers and processes transactions
  rpc DeployChainCode(DeployChainCodeInput) returns (DeployChainCodeOutput) {
    option (temporal.v1.workflow) = {
      name: "fabric.v1.DeployChainCode"
      id: 'fabric/deploy-chaincode/${! ChainCodeId }'
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
    };
  }
}

// FabricActivities service defines activities for Fabric CA operations
// These activities interact with Fabric CA for identity management
// Activities are NOT exposed via Nexus (only workflows can be called cross-namespace)
service FabricActivities {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {task_queue: "infra"};

  // RegisterIdentity registers a new identity with a Fabric CA
  // This is the first step in identity creation - registration returns an enrollment secret
  rpc RegisterIdentity(RegisterIdentityInput) returns (RegisterIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.RegisterIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // EnrollIdentity enrolls a registered identity and retrieves certificates
  // This is the second step in identity creation - enrollment uses the secret from registration
  rpc EnrollIdentity(EnrollIdentityInput) returns (EnrollIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.EnrollIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // RevokeIdentity revokes an identity from a Fabric CA
  // Used to revoke bootstrap admin credentials after permanent admin is created
  rpc RevokeIdentity(RevokeIdentityInput) returns (RevokeIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.RevokeIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }

  // BootstrapEnrollIdentity enrolls an identity using bootstrap credentials (username/password)
  // This is used ONLY during CA initialization to obtain the bootstrap admin's certificate
  // The activity generates a CSR internally and submits it to the CA
  rpc BootstrapEnrollIdentity(BootstrapEnrollIdentityInput) returns (BootstrapEnrollIdentityOutput) {
    option (temporal.v1.activity) = {
      name: "fabric.v1.BootstrapEnrollIdentity"
      schedule_to_close_timeout: {seconds: 60}
    };
  }
}

// ==================== BootstrapShard Workflow Messages ====================

// BootstrapShardInput specifies the parameters for bootstrapping a Fabric shard
message BootstrapShardInput {
  // org is the organization identifier (required)
  // All resources will be created in the org's namespace and vault paths
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // deployment is the complete fabric deployment configuration (required)
  // Caller must specify all CAs, peers, and orderers - no defaults
  OrgFabricDeployment deployment = 2 [
    json_name = "Deployment",
    (go.field).tags = 'json:"Deployment" validate:"required"'
  ];
}

// BootstrapShardOutput indicates the result of shard bootstrapping
message BootstrapShardOutput {
  // Empty for now
}

// ==================== BootstrapCertificateAuthorities Workflow Messages ====================

// BootstrapCertificateAuthoritiesInput specifies the parameters for bootstrapping certificate infrastructure
message BootstrapCertificateAuthoritiesInput {
  // org is the owner identifier (operator or organization)
  // All resources will be created in this owner's namespace and vault paths
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // certificate_authorities specifies the CAs to deploy (in order)
  // Must be TLS CAs only - workflow validates cert_type="tls"
  repeated CertificateAuthoritySpec certificate_authorities = 2 [
    json_name = "CertificateAuthorities",
    (go.field).tags = 'json:"CertificateAuthorities" validate:"required,min=1"'
  ];
}

// BootstrapCertificateAuthoritiesOutput indicates the result of certificate infrastructure bootstrapping
message BootstrapCertificateAuthoritiesOutput {
  // Empty for now
}

// ==================== DeployCertificateStore Workflow Messages ====================

// DeployCertificateStoreInput specifies the parameters for deploying the certificate store
message DeployCertificateStoreInput {
  // org is the owner identifier (operator or organization)
  // The certificate store will be created in this owner's namespace
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];
}

// DeployCertificateStoreOutput indicates the result of certificate store deployment
message DeployCertificateStoreOutput {
  // Empty for now
}

// ==================== DeployCertificateAuthority Workflow Messages ====================

// DeployCertificateAuthorityInput specifies the parameters for deploying a CA
message DeployCertificateAuthorityInput {
  // org is the owner identifier (operator or organization)
  // The CA will be created in this owner's namespace
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // spec defines the CA to deploy (required)
  CertificateAuthoritySpec spec = 2 [
    json_name = "Spec",
    (go.field).tags = 'json:"Spec" validate:"required"'
  ];
}

// DeployCertificateAuthorityOutput indicates the result of CA deployment
message DeployCertificateAuthorityOutput {
  // Empty for now
}

// ==================== CreateCertificateDatabase Workflow Messages ====================

// CreateCertificateDatabaseInput specifies the parameters for creating a certificate database
message CreateCertificateDatabaseInput {
  // org is the owner identifier (operator or organization)
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA this database is for
  CertificateAuthorityRef ca_ref = 2 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];
}

// CreateCertificateDatabaseOutput indicates the result of certificate database creation
message CreateCertificateDatabaseOutput {
  // credentials_ref is the Vault reference to retrieve the username and password
  secrets.v1.SecretRef credentials_ref = 1 [
    json_name = "CredentialsRef",
    (go.field).tags = 'json:"CredentialsRef" validate:"required"'
  ];
}

// ==================== CreateCertificate Workflow Messages ====================

// CreateCertificateInput specifies the parameters for creating a certificate.
// Keys (private) and certs (public) are stored at separate Vault paths.
message CreateCertificateInput {
  // org is the owner identifier (operator or organization)
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // issuer_ref identifies which CA signs this certificate.
  // If nil/empty, creates a self-signed certificate.
  CertificateAuthorityRef issuer_ref = 2 [
    json_name = "IssuerRef",
    (go.field).tags = 'json:"IssuerRef"'
  ];

  // profile determines key usages ("ca", "tls", or "" for default identity)
  string profile = 3 [
    json_name = "Profile",
    (go.field).tags = 'json:"Profile"'
  ];

  // subject specifies the certificate subject fields
  CertificateSubject subject = 4 [
    json_name = "Subject",
    (go.field).tags = 'json:"Subject" validate:"required"'
  ];

  // storage is where to store the created identity (key + certificate)
  IdentityRef storage = 5 [
    json_name = "Storage",
    (go.field).tags = 'json:"Storage" validate:"required"'
  ];

  // admin_identity is the issuer's admin identity for CA authentication
  // Required unless self-signed
  IdentityRef admin_identity = 6 [
    json_name = "AdminIdentity",
    (go.field).tags = 'json:"AdminIdentity"'
  ];

  // purpose is a human-readable label for the workflow ID (e.g., "tls-root-signing")
  string purpose = 7 [
    json_name = "Purpose",
    (go.field).tags = 'json:"Purpose" validate:"required"'
  ];

  // attributes are additional CA attributes for the identity (e.g., hf.IntermediateCA)
  map<string, string> attributes = 8 [json_name = "Attributes"];

  // issuer_cert_ref points to the issuing CA's certificate path (certs/ path)
  // Used to fetch the issuer's chain for building the full certificate chain
  secrets.v1.SecretRef issuer_cert_ref = 12 [
    json_name = "IssuerCertRef",
    (go.field).tags = 'json:"IssuerCertRef" validate:"required"'
  ];

  // identity_type specifies the Fabric CA identity type for registration.
  // This determines the OU field in the issued certificate.
  // Valid values: "peer", "orderer", "admin", "client" (default: "client")
  // The OU is critical for NodeOUs classification in the MSP.
  string identity_type = 10 [
    json_name = "IdentityType",
    (go.field).tags = 'json:"IdentityType,omitempty"'
  ];
}

// CreateCertificateOutput indicates the result of certificate creation
message CreateCertificateOutput {
  // identity points to the created identity (key + certificate)
  IdentityRef identity = 1 [
    json_name = "Identity",
    (go.field).tags = 'json:"Identity" validate:"required"'
  ];
}

// ==================== CreateBootstrapAdmin Workflow Messages ====================

// CreateBootstrapAdminInput specifies the parameters for creating a bootstrap admin
message CreateBootstrapAdminInput {
  // org is the owner identifier (operator or organization)
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA to create the bootstrap admin for
  CertificateAuthorityRef ca_ref = 2 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];

  // tls_issuer identifies who issues the bootstrap admin's TLS certificate.
  // If nil/empty, uses the CA itself (TLS Root CA case).
  CertificateAuthorityRef tls_issuer = 3 [
    json_name = "TlsIssuer",
    (go.field).tags = 'json:"TlsIssuer,omitempty"'
  ];

  // validity_duration specifies how long the bootstrap admin certificates are valid.
  google.protobuf.Duration validity_duration = 4 [
    json_name = "ValidityDuration",
    (go.field).tags = 'json:"ValidityDuration,omitempty"'
  ];
}

// CreateBootstrapAdminOutput indicates the result of bootstrap admin creation
message CreateBootstrapAdminOutput {
  // signing_identity points to the bootstrap admin's signing identity
  IdentityRef signing_identity = 1 [
    json_name = "SigningIdentity",
    (go.field).tags = 'json:"SigningIdentity" validate:"required"'
  ];

  // tls_identity points to the bootstrap admin's TLS client identity
  IdentityRef tls_identity = 2 [
    json_name = "TlsIdentity",
    (go.field).tags = 'json:"TlsIdentity" validate:"required"'
  ];
}

// ==================== CreateAdmin Workflow Messages ====================

// CreateAdminInput specifies the parameters for creating a permanent admin
message CreateAdminInput {
  // org is the owner identifier (operator or organization)
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA to create the admin for
  CertificateAuthorityRef ca_ref = 2 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];

  // signing_issuer identifies who issues the admin's signing certificate.
  // Per Fabric CA constraints, this should be the CA itself (admin must be in CA's database).
  CertificateAuthorityRef signing_issuer = 3 [
    json_name = "SigningIssuer",
    (go.field).tags = 'json:"SigningIssuer,omitempty"'
  ];

  // tls_issuer identifies who issues the admin's TLS certificate.
  CertificateAuthorityRef tls_issuer = 4 [
    json_name = "TlsIssuer",
    (go.field).tags = 'json:"TlsIssuer,omitempty"'
  ];

  // validity_duration specifies how long the admin certificates are valid.
  google.protobuf.Duration validity_duration = 5 [
    json_name = "ValidityDuration",
    (go.field).tags = 'json:"ValidityDuration,omitempty"'
  ];
}

// CreateAdminOutput indicates the result of admin creation
message CreateAdminOutput {
  // signing_identity points to the admin's signing identity
  IdentityRef signing_identity = 1 [
    json_name = "SigningIdentity",
    (go.field).tags = 'json:"SigningIdentity" validate:"required"'
  ];

  // tls_identity points to the admin's TLS client identity
  IdentityRef tls_identity = 2 [
    json_name = "TlsIdentity",
    (go.field).tags = 'json:"TlsIdentity" validate:"required"'
  ];
}

// ==================== CreateIdentity Workflow Messages ====================

// CreateIdentityInput specifies the parameters for creating a Fabric identity
message CreateIdentityInput {
  // org is the owner identifier (operator or organization)
  string org = 1 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // identity_name is the unique name for this identity (e.g., "peer0", "orderer0", "admin")
  string identity_name = 2 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // subject specifies the certificate subject fields
  CertificateSubject subject = 3 [
    json_name = "Subject",
    (go.field).tags = 'json:"Subject" validate:"required"'
  ];

  // org_issuer_ref identifies which Org CA issues the identity certificate
  // Typically the Org Intermediate CA (org/v1)
  CertificateAuthorityRef org_issuer_ref = 4 [
    json_name = "OrgIssuerRef",
    (go.field).tags = 'json:"OrgIssuerRef" validate:"required"'
  ];

  // tls_issuer_ref identifies which TLS CA issues the TLS certificate
  // Typically the TLS Intermediate CA (tls/v1)
  CertificateAuthorityRef tls_issuer_ref = 5 [
    json_name = "TlsIssuerRef",
    (go.field).tags = 'json:"TlsIssuerRef" validate:"required"'
  ];

  // signing_storage is where to store the signing identity (key + certificate)
  IdentityRef signing_storage = 6 [
    json_name = "SigningStorage",
    (go.field).tags = 'json:"SigningStorage" validate:"required"'
  ];

  // tls_storage is where to store the TLS identity (key + certificate)
  IdentityRef tls_storage = 7 [
    json_name = "TlsStorage",
    (go.field).tags = 'json:"TlsStorage" validate:"required"'
  ];

  // attributes are additional CA attributes for the identity
  map<string, string> attributes = 8 [json_name = "Attributes"];

  // tls_profile specifies the TLS signing profile ("tls" for server/client, "" for client-only)
  string tls_profile = 9 [
    json_name = "TlsProfile",
    (go.field).tags = 'json:"TlsProfile"'
  ];

  // identity_type specifies the Fabric CA identity type for registration.
  // This determines the OU field in the issued certificate.
  // Valid values: "peer", "orderer", "admin", "client" (default: "client")
  // The OU is critical for NodeOUs classification in the MSP.
  string identity_type = 10 [
    json_name = "IdentityType",
    (go.field).tags = 'json:"IdentityType,omitempty"'
  ];
}

// CreateIdentityOutput indicates the result of identity creation
message CreateIdentityOutput {
  // signing_identity points to the created signing identity
  IdentityRef signing_identity = 1 [
    json_name = "SigningIdentity",
    (go.field).tags = 'json:"SigningIdentity" validate:"required"'
  ];

  // tls_identity points to the created TLS identity
  IdentityRef tls_identity = 2 [
    json_name = "TlsIdentity",
    (go.field).tags = 'json:"TlsIdentity" validate:"required"'
  ];
}

// ==================== RegisterIdentity Activity Messages ====================

// RegisterIdentityInput specifies the parameters for registering an identity with a CA
message RegisterIdentityInput {
  // org is the owner identifier for the CA (operator or organization)
  string org = 7 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA to register with
  CertificateAuthorityRef ca_ref = 1 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];

  // identity_name is the unique name for this identity
  string identity_name = 2 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // affiliation is the affiliation for the identity in the CA
  string affiliation = 3 [json_name = "Affiliation"];

  // attributes are additional attributes for the identity
  map<string, string> attributes = 4 [json_name = "Attributes"];

  // identity_type specifies the type of identity (e.g., "admin", "peer", "orderer", "client")
  string identity_type = 5 [
    json_name = "IdentityType",
    (go.field).tags = 'json:"IdentityType"'
  ];

  // admin_identity is the admin identity for CA authentication
  IdentityRef admin_identity = 6 [
    json_name = "AdminIdentity",
    (go.field).tags = 'json:"AdminIdentity" validate:"required"'
  ];
}

// RegisterIdentityOutput contains the enrollment secret returned by the CA
message RegisterIdentityOutput {
  // enrollment_secret is the secret used to enroll the identity
  string enrollment_secret = 1 [
    json_name = "EnrollmentSecret",
    (go.field).tags = 'json:"EnrollmentSecret" validate:"required"'
  ];
}

// ==================== EnrollIdentity Activity Messages ====================

// EnrollIdentityInput specifies the parameters for enrolling an identity with a CA.
// Keys (private) and certs (public) are stored at separate Vault paths.
message EnrollIdentityInput {
  // org is the owner identifier for the CA (operator or organization)
  string org = 11 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA to enroll with
  CertificateAuthorityRef ca_ref = 1 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];

  // identity_name is the name of the identity to enroll
  string identity_name = 2 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // enrollment_secret is the secret obtained from registration
  string enrollment_secret = 3 [
    json_name = "EnrollmentSecret",
    (go.field).tags = 'json:"EnrollmentSecret" validate:"required"'
  ];

  // storage is the identity storage location
  // key_ref is read for CSR generation, cert_ref is where to store the result
  IdentityRef storage = 4 [
    json_name = "Storage",
    (go.field).tags = 'json:"Storage" validate:"required"'
  ];

  // subject specifies the certificate subject fields
  CertificateSubject subject = 5 [
    json_name = "Subject",
    (go.field).tags = 'json:"Subject" validate:"required"'
  ];

  // ca_tls_cert_ref points to the CA's TLS certificate in Vault (for mTLS connection)
  secrets.v1.SecretRef ca_tls_cert_ref = 6 [
    json_name = "CaTlsCertRef",
    (go.field).tags = 'json:"CaTlsCertRef" validate:"required"'
  ];

  // issuer_cert_ref points to the issuing CA's certificate path (certs/ path)
  // Used to fetch the issuer's chain for building the full certificate chain
  secrets.v1.SecretRef issuer_cert_ref = 10 [
    json_name = "IssuerCertRef",
    (go.field).tags = 'json:"IssuerCertRef" validate:"required"'
  ];

  // profile specifies which CA signing profile to use for the certificate.
  // Use "ca" for intermediate CA certificates (grants cert sign, crl sign key usages).
  // Use "tls" for TLS certificates (grants server auth, client auth key usages).
  // Leave empty to use the default profile (digital signature only).
  string profile = 7 [
    json_name = "Profile",
    (go.field).tags = 'json:"Profile,omitempty"'
  ];
}

// EnrollIdentityOutput contains the certificates returned by the CA
message EnrollIdentityOutput {
  // identity points to the enrolled identity
  IdentityRef identity = 1 [
    json_name = "Identity",
    (go.field).tags = 'json:"Identity" validate:"required"'
  ];
}

// ==================== RevokeIdentity Activity Messages ====================

// RevokeIdentityInput specifies the parameters for revoking an identity from a CA
message RevokeIdentityInput {
  // org is the owner identifier for the CA (operator or organization)
  string org = 5 [
    json_name = "Org",
    (go.field).tags = 'json:"Org" validate:"required"'
  ];

  // ca_ref identifies which CA to revoke from
  CertificateAuthorityRef ca_ref = 1 [
    json_name = "CaRef",
    (go.field).tags = 'json:"CaRef" validate:"required"'
  ];

  // identity_name is the name of the identity to revoke
  string identity_name = 2 [
    json_name = "IdentityName",
    (go.field).tags = 'json:"IdentityName" validate:"required"'
  ];

  // reason is the reason for revocation (optional)
  string reason = 3 [json_name = "Reason"];

  // admin_identity is the admin identity for CA authentication
  IdentityRef admin_identity = 4 [
    json_name = "AdminIdentity",
    (go.field).tags = 'json:"AdminIdentity" validate:"required"'
  ];
}

// RevokeIdentityOutput indicates the result of identity revocation
message RevokeIdentityOutput {
  // revoked indicates if the identity was successfully revoked
  bool revoked = 1 [json_name = "Revoked"];
}

// ==================== BootstrapEnrollIdentity Activity Messages ====================

// BootstrapEnrollIdentityInput specifies the parameters for bootstrap enrollment.
// Keys (private) and certs (public) are stored at separate Vault paths.
// Used during CA initialization to obtain the bootstrap admin's certificate.
message BootstrapEnrollIdentityInput {
  // ca_url is the CA server URL (e.g., "https://ca-tls-root.fabric-org1.svc.cluster.local:7054")
  string ca_url = 1 [
    json_name = "CaUrl",
    (go.field).tags = 'json:"CaUrl" validate:"required,url"'
  ];

  // bootstrap_credentials_ref points to the bootstrap admin username/password in Vault
  secrets.v1.SecretRef bootstrap_credentials_ref = 2 [
    json_name = "BootstrapCredentialsRef",
    (go.field).tags = 'json:"BootstrapCredentialsRef" validate:"required"'
  ];

  // storage is the identity storage location
  // key_ref is read for CSR generation, cert_ref is where to store the result
  IdentityRef storage = 3 [
    json_name = "Storage",
    (go.field).tags = 'json:"Storage" validate:"required"'
  ];

  // subject specifies the certificate subject fields
  CertificateSubject subject = 5 [
    json_name = "Subject",
    (go.field).tags = 'json:"Subject" validate:"required"'
  ];

  // ca_tls_cert_ref points to the CA's TLS certificate in Vault (for mTLS connection)
  secrets.v1.SecretRef ca_tls_cert_ref = 6 [
    json_name = "CaTlsCertRef",
    (go.field).tags = 'json:"CaTlsCertRef" validate:"required"'
  ];

  // issuer_cert_ref points to the issuing CA's certificate path (certs/ path)
  // Used to fetch the issuer's chain for building the full certificate chain.
  // Optional - if nil, the CA's chain from enrollment response is used directly.
  secrets.v1.SecretRef issuer_cert_ref = 9 [
    json_name = "IssuerCertRef",
    (go.field).tags = 'json:"IssuerCertRef,omitempty"'
  ];

  // profile specifies which CA signing profile to use
  string profile = 7 [
    json_name = "Profile",
    (go.field).tags = 'json:"Profile,omitempty"'
  ];
}

// BootstrapEnrollIdentityOutput confirms the certificate was enrolled and stored
message BootstrapEnrollIdentityOutput {
  // identity points to the enrolled identity
  IdentityRef identity = 1 [
    json_name = "Identity",
    (go.field).tags = 'json:"Identity" validate:"required"'
  ];
}

