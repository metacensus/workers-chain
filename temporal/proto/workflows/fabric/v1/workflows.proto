syntax = "proto3";

package fabric.v1;

import "google/protobuf/duration.proto";
import "nexus/v1/options.proto";
import "patch/go.proto";
import "secrets/v1/secrets.proto";
import "temporal/v1/temporal.proto";
import "fabric/v1/fabric.proto";

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/fabric/v1;fabricv1";


// Fabric service defines workflows for manipulating a Fabric shard
// These workflows run on the fabric worker in the org-specific Temporal namespace
service Fabric {
    // Enable Nexus for cross-namespace calls from central worker
    option (.nexus.v1.service).tags = "nexus-enabled";
    // Service-wide Temporal settings
    option (temporal.v1.service) = {task_queue: "infra"};
  
    // BootstrapShard is the entry point for Phase 2 of shard initialization
    // This workflow runs on the fabric worker in the org's Temporal namespace (e.g., "fabric-org1")
    // and deploys all Fabric components (CAs, peers, orderers) for the organization.
    // Called via Nexus from the central worker after Phase 1 completes
    rpc BootstrapShard(BootstrapShardInput) returns (BootstrapShardOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.BootstrapShard"
        id: 'fabric/bootstrap-shard'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // BootstrapTlsCertificateAuthorities deploys the certificate store and TLS CA chain
    // Operator-owned, runs in operator namespace, deploys TLS Root and TLS Intermediate CAs
    rpc BootstrapTlsCertificateAuthorities(BootstrapTlsCertificateAuthoritiesInput) returns (BootstrapTlsCertificateAuthoritiesOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.BootstrapTlsCertificateAuthorities"
        id: 'fabric/${! Org }/bootstrap-tls-certificate-authorities'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // BootstrapOrgCertificateAuthorities deploys the organization CA chain
    // Org-owned, runs in org namespace, deploys Org Root and Org Intermediate CAs
    rpc BootstrapOrgCertificateAuthorities(BootstrapOrgCertificateAuthoritiesInput) returns (BootstrapOrgCertificateAuthoritiesOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.BootstrapOrgCertificateAuthorities"
        id: 'fabric/${! Org }/bootstrap-org-certificate-authorities'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployCertificateStore deploys the shared certificate store (PostgreSQL)
    // used by all certificate authorities in the organization.
    rpc DeployCertificateStore(DeployCertificateStoreInput) returns (DeployCertificateStoreOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployCertificateStore"
        id: 'fabric/deploy-certificate-store'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployTlsRootCertificateAuthority deploys the TLS Root Certificate Authority
    // Operator-owned, self-signed signing and TLS certificates, admin TLS from self
    rpc DeployTlsRootCertificateAuthority(DeployTlsRootCertificateAuthorityInput) returns (DeployTlsRootCertificateAuthorityOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployTlsRootCertificateAuthority"
        id: 'fabric/${! Org }/ca/tls-root'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployTlsIntermediateCertificateAuthority deploys the TLS Intermediate Certificate Authority
    // Operator-owned, issued by TLS Root via direct workflow calls, admin TLS from self
    rpc DeployTlsIntermediateCertificateAuthority(DeployTlsIntermediateCertificateAuthorityInput) returns (DeployTlsIntermediateCertificateAuthorityOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployTlsIntermediateCertificateAuthority"
        id: 'fabric/${! Org }/ca/tls-int'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployOrgRootCertificateAuthority deploys the Organization Root Certificate Authority
    // Org-owned, self-signed signing cert, TLS cert via Nexus from TLS Int, admin TLS from TLS Int
    rpc DeployOrgRootCertificateAuthority(DeployOrgRootCertificateAuthorityInput) returns (DeployOrgRootCertificateAuthorityOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployOrgRootCertificateAuthority"
        id: 'fabric/${! Org }/ca/org-root'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployOrgIntermediateCertificateAuthority deploys the Organization Intermediate Certificate Authority
    // Org-owned, signing cert from Org Root via direct call, TLS cert via Nexus from TLS Int, admin TLS from TLS Int
    rpc DeployOrgIntermediateCertificateAuthority(DeployOrgIntermediateCertificateAuthorityInput) returns (DeployOrgIntermediateCertificateAuthorityOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployOrgIntermediateCertificateAuthority"
        id: 'fabric/${! Org }/ca/org-int'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // CreateCertificateDatabase creates a dedicated database and user for a certificate authority
    // in the shared certificate store (PostgreSQL). Each CA (root and intermediate) gets its own
    // isolated database to store issued certificates and revocation information.
    rpc CreateCertificateDatabase(CreateCertificateDatabaseInput) returns (CreateCertificateDatabaseOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.CreateCertificateDatabase"
        id: 'fabric/create-certificate-database/${! CaRef.CertType }/${! CaRef.Id }'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployCouchDb deploys a CouchDB instance for a peer
    // CouchDB provides rich query support for Fabric state database
    rpc DeployCouchDb(DeployCouchDbInput) returns (DeployCouchDbOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployCouchDb"
        id: 'fabric/deploy-couchdb/${! PeerId }'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployPeer deploys a Fabric peer node
    // Peers endorse transactions and maintain ledger state
    rpc DeployPeer(DeployPeerInput) returns (DeployPeerOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployPeer"
        id: 'fabric/deploy-peer/${! Spec.Id }'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployOrderer deploys a Fabric orderer node
    // Orderers provide consensus and block ordering services
    rpc DeployOrderer(DeployOrdererInput) returns (DeployOrdererOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployOrderer"
        id: 'fabric/deploy-orderer/${! Spec.Id }'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  
    // DeployChainCode deploys a chaincode (smart contract) to the Fabric network
    // Chaincode runs in isolated containers and processes transactions
    rpc DeployChainCode(DeployChainCodeInput) returns (DeployChainCodeOutput) {
      option (temporal.v1.workflow) = {
        name: "fabric.v1.DeployChainCode"
        id: 'fabric/deploy-chaincode/${! ChainCodeId }'
        id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      };
    }
  }
  // BootstrapShardInput specifies the parameters for bootstrapping a Fabric shard
  message BootstrapShardInput {
    // org is the organization identifier (required)
    // All resources will be created in the org's namespace and vault paths
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // deployment is the complete fabric deployment configuration (required)
    // Caller must specify all CAs, peers, and orderers - no defaults
    OrgFabricDeployment deployment = 2 [
      json_name = "Deployment",
      (go.field).tags = 'json:"Deployment" validate:"required"'
    ];
  }
  
  // BootstrapShardOutput indicates the result of shard bootstrapping
  message BootstrapShardOutput {
    // Empty for now
  }
  
  // ==================== BootstrapTlsCertificateAuthorities Workflow Messages ====================
  
  // BootstrapTlsCertificateAuthoritiesInput specifies parameters for bootstrapping TLS CA infrastructure
  message BootstrapTlsCertificateAuthoritiesInput {
    // org is the owner identifier (operator)
    // Certificate store and TLS CAs will be created in operator namespace
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // tls_root_validity specifies how long the TLS Root CA certificates are valid
    google.protobuf.Duration tls_root_validity = 2 [
      json_name = "TlsRootValidity",
      (go.field).tags = 'json:"TlsRootValidity,omitempty"'
    ];
  
    // tls_intermediate_validity specifies how long the TLS Intermediate CA certificates are valid
    google.protobuf.Duration tls_intermediate_validity = 3 [
      json_name = "TlsIntermediateValidity",
      (go.field).tags = 'json:"TlsIntermediateValidity,omitempty"'
    ];
  }
  
  // BootstrapTlsCertificateAuthoritiesOutput indicates the result of TLS CA infrastructure bootstrapping
  message BootstrapTlsCertificateAuthoritiesOutput {
    // Empty for now
  }
  
  // ==================== BootstrapOrgCertificateAuthorities Workflow Messages ====================
  
  // BootstrapOrgCertificateAuthoritiesInput specifies parameters for bootstrapping Org CA infrastructure
  message BootstrapOrgCertificateAuthoritiesInput {
    // org is the owner identifier (organization)
    // Org CAs will be created in this org's namespace
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // org_root_validity specifies how long the Org Root CA certificates are valid
    google.protobuf.Duration org_root_validity = 2 [
      json_name = "OrgRootValidity",
      (go.field).tags = 'json:"OrgRootValidity,omitempty"'
    ];
  
    // org_intermediate_validity specifies how long the Org Intermediate CA certificates are valid
    google.protobuf.Duration org_intermediate_validity = 3 [
      json_name = "OrgIntermediateValidity",
      (go.field).tags = 'json:"OrgIntermediateValidity,omitempty"'
    ];
  }
  
  // BootstrapOrgCertificateAuthoritiesOutput indicates the result of Org CA infrastructure bootstrapping
  message BootstrapOrgCertificateAuthoritiesOutput {
    // Empty for now
  }
  
  // ==================== DeployCertificateStore Workflow Messages ====================
  
  // DeployCertificateStoreInput specifies the parameters for deploying the certificate store
  message DeployCertificateStoreInput {
    // org is the owner identifier (operator or organization)
    // The certificate store will be created in this owner's namespace
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  }
  
  // DeployCertificateStoreOutput indicates the result of certificate store deployment
  message DeployCertificateStoreOutput {
    // Empty for now
  }
  
  // ==================== DeployCertificateAuthority Workflow Messages ====================
  
  // DeployCertificateAuthorityInput specifies the parameters for deploying a CA
  message DeployCertificateAuthorityInput {
    // org is the owner identifier (operator or organization)
    // The CA will be created in this owner's namespace
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // spec defines the CA to deploy (required)
    CertificateAuthoritySpec spec = 2 [
      json_name = "Spec",
      (go.field).tags = 'json:"Spec" validate:"required"'
    ];
  }
  
  // DeployCertificateAuthorityOutput indicates the result of CA deployment
  message DeployCertificateAuthorityOutput {
    // Empty for now
  }
  
  // ==================== DeployTlsRootCertificateAuthority Workflow Messages ====================
  
  // DeployTlsRootCertificateAuthorityInput specifies parameters for deploying TLS Root CA
  message DeployTlsRootCertificateAuthorityInput {
    // org is the owner identifier (operator)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // validity_duration specifies how long the CA certificates are valid
    google.protobuf.Duration validity_duration = 2 [
      json_name = "ValidityDuration",
      (go.field).tags = 'json:"ValidityDuration,omitempty"'
    ];
  }
  
  // DeployTlsRootCertificateAuthorityOutput indicates the result of TLS Root CA deployment
  message DeployTlsRootCertificateAuthorityOutput {
    // Empty for now
  }
  
  // ==================== DeployTlsIntermediateCertificateAuthority Workflow Messages ====================
  
  // DeployTlsIntermediateCertificateAuthorityInput specifies parameters for deploying TLS Intermediate CA
  message DeployTlsIntermediateCertificateAuthorityInput {
    // org is the owner identifier (operator)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // validity_duration specifies how long the CA certificates are valid
    google.protobuf.Duration validity_duration = 2 [
      json_name = "ValidityDuration",
      (go.field).tags = 'json:"ValidityDuration,omitempty"'
    ];
  }
  
  // DeployTlsIntermediateCertificateAuthorityOutput indicates the result of TLS Intermediate CA deployment
  message DeployTlsIntermediateCertificateAuthorityOutput {
    // Empty for now
  }
  
  // ==================== DeployOrgRootCertificateAuthority Workflow Messages ====================
  
  // DeployOrgRootCertificateAuthorityInput specifies parameters for deploying Org Root CA
  message DeployOrgRootCertificateAuthorityInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // validity_duration specifies how long the CA certificates are valid
    google.protobuf.Duration validity_duration = 2 [
      json_name = "ValidityDuration",
      (go.field).tags = 'json:"ValidityDuration,omitempty"'
    ];
  
    // tls_issuer identifies the TLS Intermediate CA (always TLS Int for Org Root)
    CertificateAuthorityRef tls_issuer = 3 [
      json_name = "TlsIssuer",
      (go.field).tags = 'json:"TlsIssuer" validate:"required"'
    ];
  }
  
  // DeployOrgRootCertificateAuthorityOutput indicates the result of Org Root CA deployment
  message DeployOrgRootCertificateAuthorityOutput {
    // Empty for now
  }
  
  // ==================== DeployOrgIntermediateCertificateAuthority Workflow Messages ====================
  
  // DeployOrgIntermediateCertificateAuthorityInput specifies parameters for deploying Org Intermediate CA
  message DeployOrgIntermediateCertificateAuthorityInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // validity_duration specifies how long the CA certificates are valid
    google.protobuf.Duration validity_duration = 2 [
      json_name = "ValidityDuration",
      (go.field).tags = 'json:"ValidityDuration,omitempty"'
    ];
  
    // tls_issuer identifies the TLS Intermediate CA (always TLS Int for Org Intermediate)
    CertificateAuthorityRef tls_issuer = 3 [
      json_name = "TlsIssuer",
      (go.field).tags = 'json:"TlsIssuer" validate:"required"'
    ];
  }
  
  // DeployOrgIntermediateCertificateAuthorityOutput indicates the result of Org Intermediate CA deployment
  message DeployOrgIntermediateCertificateAuthorityOutput {
    // Empty for now
  }
  
  // ==================== CreateCertificateDatabase Workflow Messages ====================
  
  // CreateCertificateDatabaseInput specifies the parameters for creating a certificate database
  message CreateCertificateDatabaseInput {
    // org is the owner identifier (operator or organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // ca_ref identifies which CA this database is for
    CertificateAuthorityRef ca_ref = 2 [
      json_name = "CaRef",
      (go.field).tags = 'json:"CaRef" validate:"required"'
    ];
  }
  
  // CreateCertificateDatabaseOutput indicates the result of certificate database creation
  message CreateCertificateDatabaseOutput {
    // credentials_ref is the Vault reference to retrieve the username and password
    secrets.v1.SecretRef credentials_ref = 1 [
      json_name = "CredentialsRef",
      (go.field).tags = 'json:"CredentialsRef" validate:"required"'
    ];
  }
  
  // ==================== DeployCouchDb Workflow Messages ====================
  
  // DeployCouchDbInput specifies the parameters for deploying a CouchDB instance
  message DeployCouchDbInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // peer_id identifies which peer this CouchDB is for (e.g., "peer0", "peer1")
    string peer_id = 2 [
      json_name = "PeerId",
      (go.field).tags = 'json:"PeerId" validate:"required"'
    ];
  }
  
  // DeployCouchDbOutput indicates the result of CouchDB deployment
  message DeployCouchDbOutput {
    // Empty for now
  }
  
  // ==================== DeployPeer Workflow Messages ====================
  
  // DeployPeerInput specifies the parameters for deploying a Fabric peer
  message DeployPeerInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // spec defines the peer to deploy (required)
    PeerSpec spec = 2 [
      json_name = "Spec",
      (go.field).tags = 'json:"Spec" validate:"required"'
    ];
  }
  
  // DeployPeerOutput indicates the result of peer deployment
  message DeployPeerOutput {
    // Empty for now
  }
  
  // ==================== DeployOrderer Workflow Messages ====================
  
  // DeployOrdererInput specifies the parameters for deploying a Fabric orderer
  message DeployOrdererInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // spec defines the orderer to deploy (required)
    OrdererSpec spec = 2 [
      json_name = "Spec",
      (go.field).tags = 'json:"Spec" validate:"required"'
    ];
  }
  
  // DeployOrdererOutput indicates the result of orderer deployment
  message DeployOrdererOutput {
    // Empty for now
  }
  
  // ==================== DeployChainCode Workflow Messages ====================
  
  // DeployChainCodeInput specifies the parameters for deploying a chaincode
  message DeployChainCodeInput {
    // org is the owner identifier (organization)
    string org = 1 [
      json_name = "Org",
      (go.field).tags = 'json:"Org" validate:"required"'
    ];
  
    // chain_code_id identifies this chaincode (e.g., "asset-transfer", "fabcar")
    string chain_code_id = 2 [
      json_name = "ChainCodeId",
      (go.field).tags = 'json:"ChainCodeId" validate:"required"'
    ];
  }
  
  // DeployChainCodeOutput indicates the result of chaincode deployment
  message DeployChainCodeOutput {
    // Empty for now
  }
  