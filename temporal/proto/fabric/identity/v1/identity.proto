syntax = "proto3";

package fabric.identity.v1;

option go_package = "github.com/metacensus/infra/temporal/gen/workflows/fabric/identity/v1;fabricidentityv1";

import "temporal/v1/temporal.proto";
import "google/protobuf/empty.proto";
import "vault/v1/vault.proto";

// FabricIdentity service defines workflows and activities for Hyperledger Fabric identity and certificate management
service FabricIdentity {
  // Service-wide Temporal settings
  option (temporal.v1.service) = {
    task_queue: "fabric-identity"
  };

  // RegisterIdentity registers a new identity with Fabric CA
  rpc RegisterIdentity(RegisterIdentityInput) returns (RegisterIdentityOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.RegisterIdentity"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };

    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.RegisterIdentity"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

  // EnrollIdentity enrolls an identity to obtain certificates
  rpc EnrollIdentity(EnrollIdentityInput) returns (EnrollIdentityOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.EnrollIdentity"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };

    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.EnrollIdentity"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

  // AssembleMsp assembles a complete MSP structure from enrollments
  rpc AssembleMsp(AssembleMspInput) returns (AssembleMspOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.AssembleMsp"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };

    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.AssembleMsp"
      schedule_to_close_timeout: {seconds: 120}  // 2 minutes
    };
  }

  // ProvisionPeer provisions a complete peer with all necessary certificates
  rpc ProvisionPeer(ProvisionPeerInput) returns (ProvisionPeerOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.ProvisionPeer"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // ProvisionOrderer provisions a complete orderer with all necessary certificates
  rpc ProvisionOrderer(ProvisionOrdererInput) returns (ProvisionOrdererOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.ProvisionOrderer"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // ProvisionClient provisions a client identity (simpler flow)
  rpc ProvisionClient(ProvisionClientInput) returns (ProvisionClientOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.ProvisionClient"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // BootstrapAdmin creates a new admin identity and revokes the default one
  rpc BootstrapAdmin(BootstrapAdminInput) returns (BootstrapAdminOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.BootstrapAdmin"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // ProvisionOrg provisions a complete organization with admin identity, peers, and orderers
  rpc ProvisionOrg(ProvisionOrgInput) returns (ProvisionOrgOutput) {
    // Workflow metadata
    option (temporal.v1.workflow) = {
      name: "fabric.identity.v1.ProvisionOrg"
      id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE
      parent_close_policy: PARENT_CLOSE_POLICY_REQUEST_CANCEL
    };
  }

  // GenerateSecureSecret generates a secure random secret
  rpc GenerateSecureSecret(GenerateSecureSecretInput) returns (GenerateSecureSecretOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.GenerateSecureSecret"
      schedule_to_close_timeout: {seconds: 30}
    };
  }

  // CreateAdminIdentity creates a new admin identity using the default admin
  rpc CreateAdminIdentity(CreateAdminIdentityInput) returns (CreateAdminIdentityOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.CreateAdminIdentity"
      schedule_to_close_timeout: {seconds: 600}  // 10 minutes
    };
  }

  // RevokeDefaultAdmin revokes the default admin identity
  rpc RevokeDefaultAdmin(RevokeDefaultAdminInput) returns (RevokeDefaultAdminOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.RevokeDefaultAdmin"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

  // CreateAffiliations creates affiliations in the Fabric CA
  rpc CreateAffiliations(CreateAffiliationsInput) returns (CreateAffiliationsOutput) {
    // Activity execution metadata
    option (temporal.v1.activity) = {
      name: "fabric.identity.v1.CreateAffiliations"
      schedule_to_close_timeout: {seconds: 300}  // 5 minutes
    };
  }

}

// RegisterIdentityInput represents input for registering a new identity (aligned with Fabric CA api.RegistrationRequest)
message RegisterIdentityInput {
  string name = 1;         // Unique identity name (maps to api.RegistrationRequest.Name)
  string type = 2;         // Identity type: peer|orderer|client|admin (maps to api.RegistrationRequest.Type)
  string secret = 3;       // Optional enrollment secret; if empty, CA generates one (maps to api.RegistrationRequest.Secret)
  string affiliation = 4;  // Organization hierarchy, e.g. "org1.department1" (maps to api.RegistrationRequest.Affiliation)
  repeated Attribute attributes = 5;  // Identity attributes (maps to api.RegistrationRequest.Attributes)
  int32 max_enrollments = 6;  // Max times secret can be reused to enroll; 0 = CA default (maps to api.RegistrationRequest.MaxEnrollments)
}

// Attribute represents an identity attribute (aligned with Fabric CA api.Attribute)
message Attribute {
  string name = 1;   // Attribute name
  string value = 2;  // Attribute value
  bool ecert = 3;    // Include in enrollment certificate
}

// RegisterIdentityOutput represents the result of identity registration
// Note: CA api.RegistrationResponse only returns Secret, but we preserve request params for workflow state
message RegisterIdentityOutput {
  string name = 1;         // Identity name (from request)
  string type = 2;         // Identity type (from request)
  string secret = 3;       // Enrollment secret returned from CA (api.RegistrationResponse.Secret)
  string affiliation = 4;  // Affiliation (from request)
  repeated Attribute attributes = 5;  // Attributes (from request)
}

// EnrollIdentityInput represents input for enrolling an identity (aligned with Fabric CA api.EnrollmentRequest)
message EnrollIdentityInput {
  string name = 1;         // Identity name to enroll (maps to api.EnrollmentRequest.Name)
  string secret = 2;       // Enrollment secret from registration (maps to api.EnrollmentRequest.Secret)
  string profile = 3;      // Signing profile: "tls" or empty for default (maps to api.EnrollmentRequest.Profile)
  CSRInfo csr = 4;         // Certificate Signing Request info (maps to api.EnrollmentRequest.CSR)
  repeated AttributeRequest attr_reqs = 5;  // Attributes to include in cert (maps to api.EnrollmentRequest.AttrReqs)
}

// CSRInfo represents Certificate Signing Request information (aligned with Fabric CA api.CSRInfo)
message CSRInfo {
  string cn = 1;           // Common Name (maps to api.CSRInfo.CN)
  repeated string hosts = 2;  // SAN hostnames (maps to api.CSRInfo.Hosts)
  repeated CSRName names = 3;  // Subject names (maps to api.CSRInfo.Names)
  KeyRequest key = 4;      // Key generation parameters (maps to api.CSRInfo.KeyRequest)
}

// CSRName represents subject name fields (aligned with cfssl csr.Name)
message CSRName {
  string c = 1;   // Country
  string st = 2;  // State/Province
  string l = 3;   // Locality
  string o = 4;   // Organization
  string ou = 5;  // Organizational Unit
}

// KeyRequest specifies key algorithm and size (aligned with Fabric CA api.KeyRequest)
message KeyRequest {
  string algo = 1;  // Algorithm: "rsa" or "ecdsa"
  int32 size = 2;   // Key size: 2048/3072/4096 for RSA, 256/384 for ECDSA
}

// AttributeRequest requests an attribute to be added to certificate (aligned with Fabric CA api.AttributeRequest)
message AttributeRequest {
  string name = 1;      // Attribute name
  bool optional = 2;    // Whether attribute is optional
}

// EnrollIdentityOutput represents the result of enrollment
// Note: private_key is generated locally (via GenCSR), not returned by CA api.EnrollmentResponse
message EnrollIdentityOutput {
  bytes certificate = 1;   // Signed X.509 certificate (PEM)
  bytes private_key = 2;   // Private key (PEM) - generated locally, not from CA
  bytes ca_cert = 3;       // CA certificate chain (PEM)
  string profile = 4;      // Profile used for enrollment (for tracking)
}

// AssembleMspInput contains parameters for MSP assembly
message AssembleMspInput {
  EnrollIdentityOutput signing_enrollment = 1;
  EnrollIdentityOutput tls_enrollment = 2;  // Optional
  repeated bytes ca_certs = 3;
  NodeOUConfig node_ou_config = 4;
}

// NodeOUConfig represents Node Organizational Unit configuration (Fabric MSP config)
// Enables role-based certificate classification
message NodeOUConfig {
  bool enable = 1;
  OUIdentifier client = 2;
  OUIdentifier peer = 3;
  OUIdentifier admin = 4;
  OUIdentifier orderer = 5;
}

// OUIdentifier identifies an organizational unit in the certificate
message OUIdentifier {
  string certificate = 1;                  // Path to CA cert or PEM-encoded cert
  string organizational_unit_identifier = 2;  // OU string value (e.g., "client", "peer")
}

// AssembleMspOutput represents a complete MSP structure
message AssembleMspOutput {
  bytes signing_cert = 1;
  bytes signing_key = 2;
  bytes tls_cert = 3;
  bytes tls_key = 4;
  repeated bytes ca_certs = 5;
  NodeOUConfig node_ou_config = 6;
}

// ProvisionPeerInput contains parameters for peer provisioning workflow
message ProvisionPeerInput {
  string peer_id = 1;
  string organization = 2;
  NodeOUConfig org_node_ous = 3;
  string namespace = 4;
  repeated string hosts = 5;  // Additional SAN hostnames for TLS cert
}

// ProvisionPeerOutput contains references to stored secrets for provisioned peer
// Note: To assemble complete MSP, fetch identity secrets + org-wide secrets
message ProvisionPeerOutput {
  vault.v1.SecretRef signing_secret = 1;  // Identity-specific signing cert/key (name: "peer-{id}-signing")
  vault.v1.SecretRef tls_secret = 2;      // Identity-specific TLS cert/key (name: "peer-{id}-tls")
  string identity_name = 3;                // Peer identity name that was provisioned
  string organization = 4;                 // Organization name (for looking up org-wide secrets)
}

// ProvisionOrdererInput contains parameters for orderer provisioning workflow
message ProvisionOrdererInput {
  string orderer_id = 1;
  string organization = 2;
  NodeOUConfig org_node_ous = 3;
  string namespace = 4;
  repeated string hosts = 5;  // Additional SAN hostnames for TLS cert
}

// ProvisionOrdererOutput contains references to stored secrets for provisioned orderer
message ProvisionOrdererOutput {
  vault.v1.SecretRef signing_secret = 1;  // Identity-specific signing cert/key (name: "orderer-{id}-signing")
  vault.v1.SecretRef tls_secret = 2;      // Identity-specific TLS cert/key (name: "orderer-{id}-tls")
  string identity_name = 3;                // Orderer identity name that was provisioned
  string organization = 4;                 // Organization name (for looking up org-wide secrets)
}

// ProvisionClientInput contains parameters for client provisioning workflow
message ProvisionClientInput {
  string client_id = 1;
  repeated Attribute custom_attributes = 2;
  string namespace = 3;
  string organization = 4;      // Organization name
  bool enable_tls = 5;           // Enable mutual TLS (optional, for client auth)
  repeated string hosts = 6;     // SAN hostnames for TLS cert (if enable_tls)
}

// ProvisionClientOutput contains references to stored secrets for provisioned client
message ProvisionClientOutput {
  vault.v1.SecretRef signing_secret = 1;  // Identity-specific signing cert/key (name: "client-{id}-signing")
  vault.v1.SecretRef tls_secret = 2;      // Identity-specific TLS cert/key (name: "client-{id}-tls", if enable_tls)
  string identity_name = 3;                // Client identity name that was provisioned
  string organization = 4;                 // Organization name (for looking up org-wide secrets)
}

// BootstrapAdminInput contains parameters for bootstrap admin workflow
message BootstrapAdminInput {
  string admin_id = 1;
  string admin_secret = 2;
  string default_admin_id = 3;
  string default_secret = 4;
  repeated Attribute attributes = 5;
  string vault_namespace = 6;  // Vault namespace for storage
}

// BootstrapAdminOutput contains the result of bootstrap admin workflow
message BootstrapAdminOutput {
  AdminIdentity admin_identity = 1;
  bool success = 2;
  string message = 3;
}

// AdminIdentity represents an admin identity for Fabric CA
message AdminIdentity {
  string id = 1;
  string secret = 2;
  bytes certificate = 3;
  bytes private_key = 4;
  bytes ca_cert = 5;
  repeated Attribute attributes = 6;
}

// ProvisionOrgInput contains parameters for organization provisioning workflow
// Note: CA endpoint removed - client configured at init time
message ProvisionOrgInput {
  string organization = 1;        // Organization name (e.g., "metacensus")
  string namespace = 2;           // Kubernetes namespace
  NodeOUConfig org_node_ous = 3;  // Node OU configuration (stored once for org)
  
  // Admin configuration
  BootstrapAdminInput admin = 4;
  
  // Affiliations to create (e.g., ["org.dept1", "org.dept2"])
  repeated string affiliations = 5;
  
  // Peer identities to provision
  repeated string peer_ids = 6;  // e.g., ["peer0", "peer1"]
  
  // Orderer identities to provision
  repeated string orderer_ids = 7;  // e.g., ["orderer0", "orderer1", "orderer2"]
  
  // Additional SAN hosts for TLS certificates (optional)
  repeated string additional_hosts = 8;
}

// ProvisionOrgOutput contains references to all provisioned identities and org-wide config
message ProvisionOrgOutput {
  string organization = 1;                       // Organization name
  vault.v1.SecretRef admin_secret = 2;           // Admin identity secret
  vault.v1.SecretRef ca_certificates = 3;        // Org-wide CA certificates (name: "{org}-ca-certificates")
  vault.v1.SecretRef node_ou_config = 4;         // Org-wide NodeOU config (name: "{org}-node-ou-config")
  repeated ProvisionPeerOutput peers = 5;        // All provisioned peers
  repeated ProvisionOrdererOutput orderers = 6;  // All provisioned orderers
}

// GenerateSecureSecretInput contains parameters for secret generation
message GenerateSecureSecretInput {
  int32 length = 1;  // Length of the secret to generate
}

// GenerateSecureSecretOutput contains the generated secret
message GenerateSecureSecretOutput {
  string secret = 1;
}

// CreateAdminIdentityInput contains parameters for creating admin identity
message CreateAdminIdentityInput {
  string admin_id = 1;
  string admin_secret = 2;
  string default_admin_id = 3;
  string default_secret = 4;
  repeated Attribute attributes = 5;
}

// CreateAdminIdentityOutput contains the created admin identity
message CreateAdminIdentityOutput {
  AdminIdentity admin_identity = 1;  // The created admin identity
}

// RevokeDefaultAdminInput contains parameters for revoking default admin
message RevokeDefaultAdminInput {
  string default_admin_id = 1;
  string default_secret = 2;
}

// RevokeDefaultAdminOutput contains result of revocation
message RevokeDefaultAdminOutput {
  bool success = 1;     // Whether revocation succeeded
  string message = 2;   // Optional message (e.g., "already revoked")
}

// CreateAffiliationsInput contains parameters for creating affiliations
message CreateAffiliationsInput {
  AdminIdentity admin_identity = 1;
  repeated string affiliations = 2;
}

// CreateAffiliationsOutput contains result of affiliation creation
message CreateAffiliationsOutput {
  repeated string created_affiliations = 1;  // Affiliations that were created
  repeated string existing_affiliations = 2;  // Affiliations that already existed
}

// OrgConfigParams contains organization-wide configuration to store in Vault
message OrgConfigParams {
  string organization = 1;           // Organization name
  string namespace = 2;              // Kubernetes namespace for secrets
  repeated bytes ca_certificates = 3;  // CA certificate chain (from enrollments)
  NodeOUConfig node_ou_config = 4;   // NodeOU configuration
}

// OrgConfigRefs contains references to stored org-wide configuration
message OrgConfigRefs {
  vault.v1.SecretRef ca_certificates = 1;  // Ref to "{org}-ca-certificates"
  vault.v1.SecretRef node_ou_config = 2;   // Ref to "{org}-node-ou-config"
}

