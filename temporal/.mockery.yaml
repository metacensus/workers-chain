# Mockery configuration for generating mocks from protobuf-generated interfaces
# See: https://vektra.github.io/mockery/

with-expecter: true
mockname: "Mock{{.InterfaceName}}"
outpkg: "{{.PackageName}}"
filename: "{{.InterfaceName | snakecase}}.go"
dir: "mocks/{{.InterfaceDirRelative}}"

# v3 compatibility settings
resolve-type-alias: false
disable-version-string: true
issue-845-fix: true

packages:
  # ============================================================================
  # GENERATED INTERFACES - Workflows and Activities from protobuf
  # Used for testing workflow orchestration and activity coordination
  # ============================================================================

  # Vault v1
  github.com/metacensus/infra/temporal/gen/workflows/vault/v1:
    config:
      dir: "mocks/workflows/vault/v1"
    interfaces:
      VaultWorkflows:
      VaultActivities:

  # Fabric Identity v1
  github.com/metacensus/infra/temporal/gen/workflows/fabric/identity/v1:
    config:
      dir: "mocks/workflows/fabric/identity/v1"
    interfaces:
      FabricIdentityWorkflows:
      FabricIdentityActivities:

  # Terraform v1
  github.com/metacensus/infra/temporal/gen/workflows/terraform/v1:
    config:
      dir: "mocks/workflows/terraform/v1"
    interfaces:
      TerraformWorkflows:
      TerraformActivities:

  # S3 Provider v1
  github.com/metacensus/infra/temporal/gen/workflows/provider/aws/s3:
    config:
      dir: "mocks/workflows/provider/aws/s3"
    interfaces:
      S3ProviderActivities:

  # Temporal Admin v1
  github.com/metacensus/infra/temporal/gen/workflows/temporal/v1:
    config:
      dir: "mocks/workflows/temporal/v1"
    interfaces:
      AdminActivities:

  # Kube Provider v1
  github.com/metacensus/infra/temporal/gen/workflows/kube/v1:
    config:
      dir: "mocks/workflows/kube/v1"
    interfaces:
      KubernetesActivities:

  # Helm v1
  github.com/metacensus/infra/temporal/gen/workflows/helm/v1:
    config:
      dir: "mocks/workflows/helm/v1"
    interfaces:
      HelmActivities:

  # ============================================================================
  # IMPLEMENTATION INTERFACES - Clients from implementation code
  # Used for testing activity implementations with mocked external dependencies
  # NOTE: Only include clients for implementations that exist
  # ============================================================================

  # Vault v1 client
  github.com/metacensus/infra/temporal/lib/workflows/vault/v1:
    config:
      dir: "mocks/workflows/vault/v1"
      outpkg: "vaultv1"
    interfaces:
      VaultClient:

  # Fabric Identity v1 client
  github.com/metacensus/infra/temporal/lib/workflows/fabric/identity/v1:
    config:
      dir: "mocks/workflows/fabric/identity/v1"
      outpkg: "fabricidentityv1"
    interfaces:
      FabricCAClient:

  # Kube v1 client
  github.com/metacensus/infra/temporal/lib/workflows/kube/v1:
    config:
      dir: "mocks/workflows/kube/v1"
      outpkg: "kubev1"
    interfaces:
      KubeClient:

  # Helm v1 client (RepoClient is the repository abstraction)
  github.com/metacensus/infra/temporal/lib/workflows/helm/v1:
    config:
      dir: "mocks/workflows/helm/v1"
      outpkg: "helmv1"
    interfaces:
      RepoClient:

  # Temporal v1 client
  github.com/metacensus/infra/temporal/lib/workflows/temporal/v1:
    config:
      dir: "mocks/workflows/temporal/v1"
      outpkg: "temporalv1"
    interfaces:
      TemporalAdminClient:

  # NOTE: Terraform and S3 client mocks will be added once implementations are created

